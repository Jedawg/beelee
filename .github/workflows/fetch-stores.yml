name: 📍 Beelee Store Locations

on:
  schedule:
    - cron: '0 3 * * 1'      # Mondays 03:00 UTC
  workflow_dispatch:

concurrency:
  group: beelee-stores
  cancel-in-progress: false

jobs:
  stores:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 📍 Fetch store locations
        run: python scrapers/fetch_stores.py

      - name: 💾 Commit and push
        run: |
          git config --local user.email "beelee-bot@users.noreply.github.com"
          git config --local user.name "Beelee Bot 🐝"
          git fetch origin main
          git reset --mixed origin/main
          git add -f data/stores.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to store locations"
            exit 0
          fi
          git commit -m "📍 Update store locations $(date +'%Y-%m-%d')"
          for i in 1 2 3; do
            if git push origin HEAD:main; then echo "✅ Pushed"; exit 0; fi
            git fetch origin main
            git reset --soft origin/main
            git commit -m "📍 Update store locations $(date +'%Y-%m-%d')" || true
            sleep 5
          done
          exit 1
