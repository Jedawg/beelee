name: 🐝 Beelee Nightly Scraper

on:
  # Run every night at midnight Copenhagen time (23:00 UTC)
  schedule:
    - cron: '0 23 * * *'

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:

# Never let two scrape runs push at the same time
concurrency:
  group: beelee-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      # 1. Download repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Install Python
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install dependencies
      - name: 📦 Install dependencies
        run: |
          # Without apt-get update the package index may be stale and the
          # install 404s. Non-fatal: OCR is optional, the merge degrades.
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-dan || echo "⚠️ tesseract unavailable — Øko image OCR will be skipped"
          pip install -r scrapers/requirements.txt

      # 4. Run Rema1000 scraper (new digital API — no longer uses Algolia)
      - name: 🛒 Run Rema1000 scraper
        run: |
          echo "Starting Rema1000 scraper..."
          python scrapers/rema1000_scraper.py
          echo "Rema1000 done!"
        continue-on-error: true

      # 5. Run Aviser scraper (weekly offers from all stores)
      - name: 📰 Run Aviser scraper
        run: |
          echo "Starting Aviser scraper..."
          python scrapers/aviser_scraper.py
          echo "Aviser done!"
        continue-on-error: true

      # 6. Run Wolt scraper (Meny full catalogue via Wolt)
      - name: 🚴 Run Wolt scraper
        run: |
          echo "Starting Wolt scraper..."
          python scrapers/wolt_scraper.py && echo "Wolt done!" || echo "⚠️ Wolt scraper failed — Wolt may block cloud IPs. Run locally and commit wolt_products.xlsx manually."
        continue-on-error: true

      # 7. Show what each scraper produced
      - name: 📊 Show scraper results
        run: |
          echo "=== Files in data/ ==="
          ls -lh data/ 2>/dev/null || echo "No data/ folder yet"
          echo ""
          for f in data/aviser_products.xlsx data/rema1000_products.xlsx data/wolt_products.xlsx; do
            if [ -f "$f" ]; then
              echo "✅ $(basename $f)"
            else
              echo "❌ $(basename $f) — NOT created"
            fi
          done

      # 8. Merge all scrapers + harmonize categories → products.xlsx
      - name: 🔀 Merge and harmonize
        run: |
          echo "Merging all products..."
          python scrapers/merge_products_with_categories.py
          echo "Merge done!"

      # 9. Enrich with nutrition data + Nutri-Score
      - name: 🥗 Enrich nutrition
        run: |
          echo "Looking up nutrition on Open Food Facts..."
          python scrapers/enrich_nutrition.py
          echo "Enrichment done!"
        continue-on-error: true

      # 10. Estimate Nutri-Score for products OFF didn't cover
      - name: 🔬 Estimate missing Nutri-Scores
        run: |
          echo "Matching uncovered products against scored ones..."
          python scrapers/estimate_nutriscore.py
          echo "Estimation done!"
        continue-on-error: true

      # 11. Verify final output
      - name: ✅ Verify output
        run: |
          if [ -f "data/products.xlsx" ]; then
            SIZE=$(du -h data/products.xlsx | cut -f1)
            echo "✅ products.xlsx created — $SIZE"
          else
            echo "❌ products.xlsx was NOT created!"
            exit 1
          fi

      # 12. Commit all data files back to GitHub
      - name: 💾 Commit and push
        run: |
          git config --local user.email "beelee-bot@users.noreply.github.com"
          git config --local user.name "Beelee Bot 🐝"

          # The run takes ~20 min, so main may have moved while we worked.
          # Move onto the latest remote commit BEFORE committing our data.
          # --mixed keeps the generated files in the working tree but resets
          # the index, so we then commit them cleanly on top of the new tip.
          # No merge, no rebase, no binary conflicts.
          git fetch origin main
          git reset --mixed origin/main

          # Stage only the files this workflow generates
          git add -f data/products.xlsx           2>/dev/null || true
          git add -f data/rema1000_products.xlsx  2>/dev/null || true
          git add -f data/aviser_products.xlsx    2>/dev/null || true
          git add -f data/wolt_products.xlsx      2>/dev/null || true
          git add -f data/off_cache.json          2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes — products are up to date"
            exit 0
          fi

          git commit -m "🐝 Auto-update products $(date +'%Y-%m-%d %H:%M UTC')"

          # Retry in case someone pushed during the commit itself
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "✅ Pushed"
              exit 0
            fi
            echo "Push rejected, re-syncing (attempt $i)..."
            git fetch origin main
            git reset --soft origin/main
            git commit -m "🐝 Auto-update products $(date +'%Y-%m-%d %H:%M UTC')" || true
            sleep 5
          done

          echo "❌ Could not push after 3 attempts"
          exit 1
