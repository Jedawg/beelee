  <title>Beelee</title>
  
  <script>
    (function() {
      if (typeof window === 'undefined') return;

      const DB_NAME = 'BeeleeProductsDB';
      const DB_VERSION = 1;
      const STORE_NAME = 'products';

      window.ProductDB = {
        db: null,

        async init() {
          return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);

            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
              this.db = request.result;
              resolve(this.db);
            };

            request.onupgradeneeded = (event) => {
              const db = event.target.result;
              
              if (!db.objectStoreNames.contains(STORE_NAME)) {
                const objectStore = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                objectStore.createIndex('title', 'title', { unique: false });
                objectStore.createIndex('category', 'category', { unique: false });
                objectStore.createIndex('store', 'store', { unique: false });
                objectStore.createIndex('price', 'price', { unique: false });
              }
            };
          });
        },

        async saveProducts(products) {
          const tx = this.db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          
          store.clear();
          
          for (const product of products) {
            store.put(product);
          }
          
          return new Promise((resolve, reject) => {
            tx.oncomplete = () => {
              console.log(`✅ Saved ${products.length} products to IndexedDB`);
              resolve();
            };
            tx.onerror = () => reject(tx.error);
          });
        },

        async count() {
          const tx = this.db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          
          return new Promise((resolve, reject) => {
            const request = store.count();
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          });
        },

        async search({ searchTerm, category, stores, sortOrder, limit = 100 }) {
          const tx = this.db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          
          return new Promise((resolve, reject) => {
            const request = store.getAll();
            
            request.onsuccess = () => {
              let allProducts = request.result;
              
              let results = allProducts.filter(p => {
                const matchesSearch = !searchTerm || 
                  p.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                  p.category.toLowerCase().includes(searchTerm.toLowerCase());
                
                const matchesCategory = !category || p.category === category;
                const matchesStore = !stores || stores.includes(p.store);
                
                return matchesSearch && matchesCategory && matchesStore;
              });
              
              if (sortOrder === 'asc') {
                results.sort((a, b) => a.price - b.price);
              } else if (sortOrder === 'desc') {
                results.sort((a, b) => b.price - a.price);
              }
              
              const seen = new Set();
              const deduplicated = [];
              
              for (const product of results) {
                if (!seen.has(product.id)) {
                  seen.add(product.id);
                  deduplicated.push(product);
                  if (deduplicated.length >= limit) break;
                }
              }
              
              resolve(deduplicated);
            };
            
            request.onerror = () => reject(request.error);
          });
        },

        async getCategories() {
          const tx = this.db.transaction(STORE_NAME, 'readonly');
          const index = tx.objectStore(STORE_NAME).index('category');
          const categories = new Set();
          
          return new Promise((resolve, reject) => {
            const request = index.openCursor();
            
            request.onsuccess = (event) => {
              const cursor = event.target.result;
              if (cursor) {
                categories.add(cursor.value.category);
                cursor.continue();
              } else {
                resolve(Array.from(categories).sort());
              }
            };
            
            request.onerror = () => reject(request.error);
          });
        },

        async getStores() {
          const tx = this.db.transaction(STORE_NAME, 'readonly');
          const index = tx.objectStore(STORE_NAME).index('store');
          const stores = new Set();
          
          return new Promise((resolve, reject) => {
            const request = index.openCursor();
            
            request.onsuccess = (event) => {
              const cursor = event.target.result;
              if (cursor) {
                stores.add(cursor.value.store);
                cursor.continue();
              } else {
                resolve(Array.from(stores).sort());
              }
            };
            
            request.onerror = () => reject(request.error);
          });
        }
      };
    })();
  </script>

    // Virtual scroll hook
    function useVirtualScroll(items, itemHeight = 100, containerHeight = 600) {
      const [scrollTop, setScrollTop] = useState(0);
      const containerRef = useRef(null);

      const handleScroll = useCallback((e) => {
        setScrollTop(e.target.scrollTop);
      }, []);

      const startIndex = Math.floor(scrollTop / itemHeight);
      const endIndex = Math.min(items.length - 1, Math.floor((scrollTop + containerHeight) / itemHeight));
      const bufferSize = 5;
      const visibleStartIndex = Math.max(0, startIndex - bufferSize);
      const visibleEndIndex = Math.min(items.length - 1, endIndex + bufferSize);
      const visibleItems = items.slice(visibleStartIndex, visibleEndIndex + 1);
      const offsetY = visibleStartIndex * itemHeight;
      const totalHeight = items.length * itemHeight;

      return { visibleItems, offsetY, totalHeight, containerRef, handleScroll, visibleStartIndex };
    }

    // Utils
    const fileCache = new Map();

    async function parseExcel(file) {
      if (fileCache.has(file.name)) return fileCache.get(file.name);
      const buffer = await file.arrayBuffer();
      const wb = XLSX.read(buffer);
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws);
      const products = rows.map(row => ({
        id: crypto.randomUUID(),
        title: row.title || 'Unknown',
        price: Number(row.price) || 0,
        category: row.category || 'Uncategorized',
        store: row.store || 'Unknown',
        imageBase64: row.image_base64 || null,
        offerExpiryDate: row.offer_expiry_date || null,
        remainingDays: row.remaining_days !== undefined ? Number(row.remaining_days) : null
      }));
      fileCache.set(file.name, products);
      return products;
    }

    function getStoreColor(store) {
      const colors = {
        'Rema1000': { bg: 'bg-blue-100', text: 'text-blue-700', name: 'REMA 1000' },
        'Netto': { bg: 'bg-yellow-100', text: 'text-yellow-700', name: 'NETTO' },
        'Min Kobmand': { bg: 'bg-green-800', text: 'text-white', name: 'MIN KØBMAND' },
        'Spar': { bg: 'bg-green-600', text: 'text-white', name: 'SPAR' },
        'Føtex': { bg: 'bg-blue-600', text: 'text-white', name: 'FØTEX' },
        'SuperBrugsen & Kvickly': { bg: 'bg-red-600', text: 'text-white', name: 'SUPERBRUGSEN & KVICKLY' },
        '365': { bg: 'bg-green-200', text: 'text-green-900', name: '365' },
        'Meny': { bg: 'bg-red-700', text: 'text-white', name: 'MENY' },
        'Brugsen': { bg: 'bg-red-600', text: 'text-white', name: 'BRUGSEN' },
        'Lidl': { bg: 'bg-yellow-400', text: 'text-blue-900', name: 'LIDL' }
      };
      return colors[store] || { bg: 'bg-gray-100', text: 'text-gray-700', name: store.toUpperCase() };
    }

    function getCheapestByCategory(productsById) {
      const byCategory = {};
      Object.values(productsById).forEach(product => {
        const cat = product.category;
        if (!byCategory[cat] || product.price < byCategory[cat].price) {
          byCategory[cat] = product;
        }
      });
      return Object.values(byCategory).sort((a, b) => a.category.localeCompare(b.category));
    }

    function generateBasketText(basket, productsById) {
      const storeGroups = {};
      let totalPrice = 0;

      basket.forEach(item => {
        const product = productsById[item.productId];
        if (!product) return;
        
        if (!storeGroups[product.store]) {
          storeGroups[product.store] = { items: [], total: 0 };
        }
        
        const itemTotal = product.price * item.quantity;
        storeGroups[product.store].items.push({
          title: product.title,
          quantity: item.quantity,
          price: product.price,
          total: itemTotal
        });
        storeGroups[product.store].total += itemTotal;
        totalPrice += itemTotal;
      });

      let text = '🛒 SHOPPING BASKET\n═══════════════════════════════\n\n';

      Object.entries(storeGroups).forEach(([store, data]) => {
        const storeInfo = getStoreColor(store);
        text += `📍 ${storeInfo.name}\n───────────────────────────────\n`;
        data.items.forEach(item => {
          text += `• ${item.title}\n  ${item.quantity}x ${item.price.toFixed(2)} kr = ${item.total.toFixed(2)} kr\n`;
        });
        text += `\nStore Total: ${data.total.toFixed(2)} kr\n\n`;
      });

      text += '═══════════════════════════════\n';
      text += `GRAND TOTAL: ${totalPrice.toFixed(2)} kr\n`;
      text += `Total Items: ${basket.reduce((sum, item) => sum + item.quantity, 0)}\n`;
      text += '═══════════════════════════════\n';

      return text;
    }

    // Products hook - MOBILE SAFE
    function useProducts() {
      const [productsById, setProductsById] = useState({});
      const [productIds, setProductIds] = useState([]);
      const [dbReady, setDbReady] = useState(false);
      const [autoLoading, setAutoLoading] = useState(false);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [autoLoadError, setAutoLoadError] = useState(false);
      const [totalProductCount, setTotalProductCount] = useState(0);

      useEffect(() => {
        initializeDatabase();
      }, []);

      const initializeDatabase = async () => {
        setAutoLoading(true);
        
        try {
          if (!window.ProductDB) throw new Error('IndexedDB not available');
          
          await window.ProductDB.init();
          const count = await window.ProductDB.count();
          
          if (count > 0) {
            console.log(`📦 Found ${count} products in IndexedDB`);
            setTotalProductCount(count);
            setDbReady(true);
            setLastUpdated(new Date().toLocaleString('da-DK'));
            setAutoLoading(false);
            updateDatabaseInBackground();
            return;
          }
          
          await downloadAndCacheProducts();
        } catch (error) {
          console.error('Failed to initialize database:', error);
          setAutoLoadError(true);
          setAutoLoading(false);
        }
      };

      const downloadAndCacheProducts = async () => {
        try {
          console.log('📥 Downloading products...');
          
          const response = await fetch(DATA_URL + '?t=' + Date.now());
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          
          const buffer = await response.arrayBuffer();
          const wb = XLSX.read(buffer);
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws);
          
          const products = rows.map(row => ({
            id: crypto.randomUUID(),
            title: row.title || 'Unknown',
            price: Number(row.price) || 0,
            category: row.category || 'Uncategorized',
            store: row.store || 'Unknown',
            imageBase64: row.image_base64 || null,
            offerExpiryDate: row.offer_expiry_date || null,
            remainingDays: row.remaining_days !== undefined ? Number(row.remaining_days) : null
          }));
          
          if (window.ProductDB) {
            await window.ProductDB.saveProducts(products);
          }
          
          setTotalProductCount(products.length);
          setDbReady(true);
          setLastUpdated(new Date().toLocaleString('da-DK'));
          setAutoLoading(false);
        } catch (err) {
          console.error('Download failed:', err);
          setAutoLoading(false);
          setAutoLoadError(true);
          throw err;
        }
      };

      const updateDatabaseInBackground = async () => {
        try {
          console.log('🔄 Background update...');
          await downloadAndCacheProducts();
        } catch (err) {
          console.log('Background update failed');
        }
      };

      const refreshFromGitHub = async () => {
        setAutoLoading(true);
        await downloadAndCacheProducts();
      };

      const searchProducts = useCallback(async (searchTerm, filters = {}) => {
        if (!dbReady) return;

        try {
          const { category, stores, sortOrder } = filters;
          
          let results = await window.ProductDB.search({
            searchTerm,
            category: category === 'all' ? null : category,
            stores: stores.length === 0 ? null : stores,
            sortOrder,
            limit: 100
          });

          console.log(`🔍 Found ${results.length} products`);

          const byId = {};
          const ids = [];
          results.forEach(p => { byId[p.id] = p; ids.push(p.id); });
          
          setProductsById(byId);
          setProductIds(ids);
        } catch (err) {
          console.error('Search failed:', err);
        }
      }, [dbReady]);

      const getCategories = useCallback(async () => {
        if (!dbReady) return ['all'];
        try {
          const categories = await window.ProductDB.getCategories();
          return ['all', ...categories];
        } catch {
          return ['all'];
        }
      }, [dbReady]);

      const getStores = useCallback(async () => {
        if (!dbReady) return ['all'];
        try {
          const stores = await window.ProductDB.getStores();
          return ['all', ...stores];
        } catch {
          return ['all'];
        }
      }, [dbReady]);

      const addProductsFromFile = useCallback(async (file) => {
        const newProducts = await parseExcel(file);
        if (window.ProductDB) {
          await window.ProductDB.saveProducts(newProducts);
        }
        setTotalProductCount(prev => prev + newProducts.length);
        setLastUpdated(new Date().toLocaleString('da-DK'));
      }, []);

      return { 
        productsById, productIds, dbReady, totalProductCount,
        searchProducts, getCategories, getStores, addProductsFromFile, 
        autoLoading, lastUpdated, autoLoadError, refreshFromGitHub 
      };
    }

    // Recipes & Basket hooks (simplified for space - your original versions work)
    function useRecipes(productsById) {
      const [recipes, setRecipes] = useState([]);
      const [currentRecipe, setCurrentRecipe] = useState({ id: null, name: '', ingredients: [] });
      
      return {
        recipes,
        currentRecipe,
        saveRecipe: () => {},
        loadRecipe: () => {},
        deleteRecipe: () => {},
        updateRecipeName: (name) => setCurrentRecipe(prev => ({ ...prev, name })),
        addIngredient: () => {},
        removeIngredient: () => {},
        updateIngredientQuantity: () => {},
        createNewRecipe: () => setCurrentRecipe({ id: null, name: '', ingredients: [] })
      };
    }

    function useBasket() {
      const [basket, setBasket] = useState([]);
      
      return {
        basket,
        addToBasket: (id) => setBasket(prev => [...prev, { productId: id, quantity: 1 }]),
        removeFromBasket: (id) => setBasket(prev => prev.filter(i => i.productId !== id)),
        updateBasketQuantity: () => {},
        clearBasket: () => setBasket([]),
        addRecipeToBasket: () => {}
      };
    }

    // Components
    function StoreBadge({ store }) {
      const storeInfo = getStoreColor(store);
      return <span className={`text-xs ${storeInfo.bg} ${storeInfo.text} px-2 py-0.5 rounded font-semibold`}>{storeInfo.name}</span>;
    }

    function VirtualProductList({ products, onProductClick, onAddToBasket }) {
      const { visibleItems, offsetY, totalHeight, containerRef, handleScroll, visibleStartIndex } = useVirtualScroll(products, 100, 600);

      return (
        <div ref={containerRef} onScroll={handleScroll} style={{ height: '600px', overflow: 'auto', position: 'relative' }}>
          <div style={{ height: `${totalHeight}px`, position: 'relative' }}>
            <div style={{ transform: `translateY(${offsetY}px)`, position: 'absolute', width: '100%' }}>
              {visibleItems.map((product, idx) => (
                <div key={product.id} className="px-3" style={{ height: '100px' }}>
                  <div className="flex items-center gap-3 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 cursor-pointer border-b" onClick={() => onProductClick(product)}>
                    <div className="w-16 h-16 flex-shrink-0">
                      {product.imageBase64 ? (
                        <img src={product.imageBase64} alt={product.title} className="w-full h-full object-cover rounded-lg" loading="lazy" />
                      ) : (
                        <div className="w-full h-full bg-gray-200 rounded-lg"></div>
                      )}
                    </div>
                    <div className="flex-1 min-w-0">
                      <h3 className="font-semibold text-sm truncate">{product.title}</h3>
                      <div className="flex items-center gap-2 mt-1">
                        <StoreBadge store={product.store} />
                        <span className="text-xs text-gray-500">{product.category}</span>
                      </div>
                    </div>
                    <div className="text-right">
                      <p className="text-lg font-bold text-indigo-600">{product.price.toFixed(2)} kr</p>
                      <button onClick={(e) => { e.stopPropagation(); onAddToBasket(product.id); }} className="mt-2 px-3 py-1 bg-green-600 text-white rounded-lg text-xs">
                        + Basket
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function ProductsTab({ productsById, productIds, dbReady, totalProductCount, searchProducts, getCategories, getStores, onAddToBasket }) {
      const [search, setSearch] = useState('');
      const [category, setCategory] = useState('all');
      const [selectedStores, setSelectedStores] = useState([]);
      const [sortOrder, setSortOrder] = useState('asc');
      const [hasSearched, setHasSearched] = useState(false);
      const [categories, setCategories] = useState(['all']);
      const [stores, setStores] = useState(['all']);
      const [selectedProduct, setSelectedProduct] = useState(null);

      useEffect(() => {
        if (dbReady) {
          loadFiltersFromDB();
        }
      }, [dbReady]);

      const loadFiltersFromDB = async () => {
        const cats = await getCategories();
        const strs = await getStores();
        setCategories(cats);
        setStores(strs);
      };

      useEffect(() => {
        if (!search && category === 'all' && selectedStores.length === 0 && !hasSearched) return;

        const timer = setTimeout(() => {
          if (searchProducts) {
            searchProducts(search, { category, stores: selectedStores, sortOrder });
            setHasSearched(true);
          }
        }, 300);

        return () => clearTimeout(timer);
      }, [search, category, selectedStores, sortOrder]);

      const products = useMemo(() => {
        return productIds.map(id => productsById[id]).filter(p => p !== undefined);
      }, [productIds, productsById]);

      return (
        <div>
          {!dbReady && (
            <div className="mb-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
              <p className="text-sm text-yellow-800">⏳ Preparing database...</p>
            </div>
          )}

          <div className="mb-6 p-4 bg-gradient-to-r from-indigo-50 to-purple-50 border-2 border-indigo-200 rounded-xl">
            <div className="flex items-center gap-2 mb-3">
              <Search className="w-5 h-5 text-indigo-600" />
              <h3 className="font-bold text-gray-800">Search Products</h3>
            </div>
            
            <div className="relative">
              <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5" />
              <input
                type="text"
                placeholder="Type to search..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                className="w-full pl-10 pr-10 py-3 border-2 border-indigo-300 rounded-lg text-lg"
                disabled={!dbReady}
              />
              {search && (
                <button onClick={() => setSearch('')} className="absolute right-3 top-1/2 transform -translate-y-1/2">
                  <X className="w-5 h-5 text-gray-400" />
                </button>
              )}
            </div>

            {!hasSearched && dbReady && (
              <p className="text-sm text-gray-600 mt-2">
                💡 {totalProductCount} products ready (max 100 results per search)
              </p>
            )}
          </div>

          {hasSearched && (
            <>
              <div className="flex gap-3 mb-6">
                <select value={category} onChange={(e) => setCategory(e.target.value)} className="flex-1 px-4 py-3 border rounded-lg">
                  {categories.map(cat => <option key={cat} value={cat}>{cat === 'all' ? 'All Categories' : cat}</option>)}
                </select>
                <button onClick={() => setSortOrder(p => p === 'asc' ? 'desc' : 'asc')} className="px-6 py-3 bg-indigo-600 text-white rounded-lg">
                  <ArrowUpDown className="w-5 h-5 inline" /> {sortOrder === 'asc' ? 'Cheapest' : 'Expensive'}
                </button>
              </div>

              <div className="border rounded-lg bg-white">
                <div className="p-3 bg-gray-50 border-b">
                  <p className="text-sm font-semibold">{products.length > 0 ? `Showing ${products.length} products` : 'No results'}</p>
                </div>
                
                {products.length > 0 ? (
                  <VirtualProductList products={products} onProductClick={setSelectedProduct} onAddToBasket={onAddToBasket} />
                ) : (
                  <div className="p-8 text-center text-gray-500">
                    <p>No results for "{search}"</p>
                  </div>
                )}
              </div>
            </>
          )}
        </div>
      );
    }

    function BestOffersTab({ productsById, onAddToBasket }) {
      const cheapest = useMemo(() => getCheapestByCategory(productsById), [productsById]);

      if (Object.keys(productsById).length === 0) {
        return <div className="text-center py-12"><p className="text-gray-600">Search for products first</p></div>;
      }

      return (
        <div className="space-y-4">
          {cheapest.map(p => (
            <div key={p.id} className="bg-green-50 border-2 border-green-200 rounded-lg p-4 flex items-center gap-4">
              <div className="flex-1">
                <span className="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded">BEST PRICE</span>
                <h3 className="font-bold text-lg mt-2">{p.title}</h3>
                <StoreBadge store={p.store} />
              </div>
              <div className="text-right">
                <p className="text-3xl font-bold text-green-600">{p.price.toFixed(2)} kr</p>
                <button onClick={() => onAddToBasket(p.id)} className="mt-2 px-4 py-2 bg-green-600 text-white rounded-lg">+ Basket</button>
              </div>
            </div>
          ))}
        </div>
      );
    }

    function LoginScreen({ onLogin }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');

      const handleLogin = async () => {
        if (!username || !password) {
          setError('Enter username and password');
          return;
        }
        
        try {
          const response = await fetch(`${API_URL}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Login failed');

          localStorage.setItem('beelee_token', data.token);
          localStorage.setItem('beelee_user', JSON.stringify(data.user));
          onLogin(data.user);
        } catch (err) {
          setError('❌ ' + err.message);
        }
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-600 to-blue-700 flex items-center justify-center p-4">
          <div className="w-full max-w-sm">
            <div className="text-center mb-8">
              <div className="text-6xl mb-3">🐝</div>
              <h1 className="text-4xl font-bold text-white">Beelee</h1>
            </div>

            <div className="bg-white rounded-2xl p-8">
              <div className="space-y-5">
                <input
                  type="text"
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  placeholder="Username"
                  className="w-full px-4 py-3 border-2 rounded-xl"
                />
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="Password"
                  className="w-full px-4 py-3 border-2 rounded-xl"
                />
                {error && <div className="bg-red-50 text-red-700 px-4 py-3 rounded-xl text-sm">{error}</div>}
                <button onClick={handleLogin} className="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold text-lg">
                  Sign In
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('products');
      const [loggedInUser, setLoggedInUser] = useState(() => {
        const token = localStorage.getItem('beelee_token');
        const userStr = localStorage.getItem('beelee_user');
        if (token && userStr) {
          try { return JSON.parse(userStr); } catch { return null; }
        }
        return null;
      });
      
      const { productsById, productIds, dbReady, totalProductCount, searchProducts, getCategories, getStores, addProductsFromFile, autoLoading, lastUpdated, autoLoadError, refreshFromGitHub } = useProducts();
      const { recipes, currentRecipe, saveRecipe, loadRecipe, deleteRecipe, updateRecipeName, addIngredient, removeIngredient, updateIngredientQuantity, createNewRecipe } = useRecipes(productsById);
      const { basket, addToBasket, removeFromBasket, updateBasketQuantity, clearBasket, addRecipeToBasket } = useBasket();

      if (!loggedInUser) return <LoginScreen onLogin={setLoggedInUser} />;

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-3 md:p-6">
          <div className="max-w-6xl mx-auto">
            <div className="bg-white rounded-2xl shadow-xl p-4 md:p-8">
              <div className="flex items-center justify-between mb-2">
                <div>
                  <h1 className="text-2xl md:text-4xl font-bold text-gray-800">🐝 Beelee</h1>
                  <p className="text-sm text-gray-600">Mobile-optimized smart shopping</p>
                </div>
                <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="text-xs px-3 py-1.5 bg-gray-100 rounded-lg">
                  Sign Out
                </button>
              </div>

              {autoLoading && (
                <div className="mb-4 p-3 bg-indigo-50 border border-indigo-200 rounded-lg flex items-center gap-3">
                  <div className="w-4 h-4 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                  <p className="text-sm text-indigo-700">Caching products...</p>
                </div>
              )}

              {!autoLoading && lastUpdated && (
                <div className="mb-4 p-3 bg-green-50 border border-green-200 rounded-lg flex items-center justify-between">
                  <p className="text-sm text-green-700">{totalProductCount} products cached · {lastUpdated}</p>
                  <button onClick={refreshFromGitHub} className="text-xs px-3 py-1.5 bg-green-600 text-white rounded-lg">🔄 Refresh</button>
                </div>
              )}

              <div className="flex gap-2 mt-4 mb-6 border-b border-gray-200 overflow-x-auto">
                <button onClick={() => setActiveTab('products')} className={`flex items-center gap-2 px-4 py-3 font-semibold ${activeTab === 'products' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-gray-500'}`}>
                  <ShoppingCart className="w-5 h-5" />
                  Products
                </button>
                <button onClick={() => setActiveTab('offers')} className={`flex items-center gap-2 px-4 py-3 font-semibold ${activeTab === 'offers' ? 'text-green-600 border-b-2 border-green-600' : 'text-gray-500'}`}>
                  <TrendingDown className="w-5 h-5" />
                  Offers
                </button>
                <button onClick={() => setActiveTab('basket')} className={`flex items-center gap-2 px-4 py-3 font-semibold ${activeTab === 'basket' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-gray-500'}`}>
                  <ShoppingBag className="w-5 h-5" />
                  Basket
                  {basket.length > 0 && <span className="bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">{basket.length}</span>}
                </button>
              </div>

              {activeTab === 'products' && <ProductsTab productsById={productsById} productIds={productIds} dbReady={dbReady} totalProductCount={totalProductCount} searchProducts={searchProducts} getCategories={getCategories} getStores={getStores} onAddToBasket={addToBasket} />}
              {activeTab === 'offers' && <BestOffersTab productsById={productsById} onAddToBasket={addToBasket} />}
              {activeTab === 'basket' && (
                <div className="text-center py-12">
                  <ShoppingBag className="w-16 h-16 text-gray-300 mx-auto mb-4" />
                  <p className="text-gray-600">{basket.length === 0 ? 'Basket is empty' : `${basket.length} items in basket`}</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
