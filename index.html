  <script>
    (function () {
      if (typeof window === 'undefined') return;
      const DB_NAME = 'BeeleeProductsDB', DB_VERSION = 1, STORE = 'products';
      window.ProductDB = {
        db: null,
        async init() {
          if (this.db) return this.db;
          return new Promise((res, rej) => {
            const r = indexedDB.open(DB_NAME, DB_VERSION);
            r.onerror = () => rej(r.error);
            r.onsuccess = () => { this.db = r.result; res(this.db); };
            r.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(STORE)) {
                const os = db.createObjectStore(STORE, { keyPath: 'id' });
                os.createIndex('category', 'category', { unique: false });
                os.createIndex('store', 'store', { unique: false });
              }
            };
          });
        },
        async saveProducts(products) {
          const tx = this.db.transaction(STORE, 'readwrite');
          const os = tx.objectStore(STORE);
          os.clear();
          for (const p of products) os.put(p);
          return new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
        },
        async count() {
          const tx = this.db.transaction(STORE, 'readonly');
          return new Promise((res, rej) => {
            const r = tx.objectStore(STORE).count();
            r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
          });
        },
        async search({ searchTerm='', category=null, stores=null, sortOrder='asc', limit=100 }) {
          const tx = this.db.transaction(STORE, 'readonly');
          return new Promise((res, rej) => {
            const r = tx.objectStore(STORE).getAll();
            r.onsuccess = () => {
              let all = r.result.filter(p => {
                const ms  = !searchTerm || p.title.toLowerCase().includes(searchTerm.toLowerCase());
                const mc  = !category   || p.category === category;
                const mst = !stores     || !stores.length || stores.includes(p.store);
                return ms && mc && mst;
              });
              all.sort((a,b) => sortOrder==='asc' ? a.price-b.price : b.price-a.price);
              res(all.slice(0, limit));
            };
            r.onerror = () => rej(r.error);
          });
        },
        async getByIds(ids) {
          const tx = this.db.transaction(STORE, 'readonly');
          const os = tx.objectStore(STORE);
          return Promise.all(ids.map(id => new Promise(res => {
            const r = os.get(id); r.onsuccess = () => res(r.result||null); r.onerror = () => res(null);
          })));
        },
        async getCategories() {
          const tx = this.db.transaction(STORE, 'readonly');
          const cats = new Set();
          return new Promise((res, rej) => {
            const r = tx.objectStore(STORE).index('category').openCursor();
            r.onsuccess = e => { const c=e.target.result; if(c){cats.add(c.value.category);c.continue();}else res([...cats].filter(Boolean).sort()); };
            r.onerror = () => rej(r.error);
          });
        },
        async getStores() {
          const tx = this.db.transaction(STORE, 'readonly');
          const stores = new Set();
          return new Promise((res, rej) => {
            const r = tx.objectStore(STORE).index('store').openCursor();
            r.onsuccess = e => { const c=e.target.result; if(c){stores.add(c.value.store);c.continue();}else res([...stores].filter(Boolean).sort()); };
            r.onerror = () => rej(r.error);
          });
        }
      };
    })();
  </script>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

const API_URL  = 'https://beelee-backend.onrender.com';
const DATA_URL = 'https://raw.githubusercontent.com/Jedawg/beelee/main/data/products.xlsx';

/* ─────────────────────────────────────────
   Store colour map (dot + label colour)
───────────────────────────────────────── */
const STORE_META = {
  'Rema1000':               { dot:'#003D8F', bg:'#E8F0FB', tx:'#003D8F', name:'Rema 1000' },
  'Netto':                  { dot:'#F9C200', bg:'#FEF8D9', tx:'#7A5F00', name:'Netto' },
  'Lidl':                   { dot:'#EF3340', bg:'#FDECEA', tx:'#B00020', name:'Lidl' },
  'Føtex':                  { dot:'#0046A0', bg:'#E8EFF9', tx:'#0046A0', name:'Føtex' },
  'Meny':                   { dot:'#C8102E', bg:'#FCEDEF', tx:'#8B0B1F', name:'Meny' },
  'Brugsen':                { dot:'#E30613', bg:'#FDECEA', tx:'#9A0007', name:'Brugsen' },
  'SuperBrugsen & Kvickly': { dot:'#E30613', bg:'#FDECEA', tx:'#9A0007', name:'SuperBrugsen' },
  'Bilka':                  { dot:'#004FA3', bg:'#E8EFF9', tx:'#003570', name:'Bilka' },
  'Spar':                   { dot:'#007A4D', bg:'#E5F4EC', tx:'#004D2E', name:'Spar' },
  'Min Kobmand':            { dot:'#2D5F2D', bg:'#E5F4EC', tx:'#1A3D1A', name:'Min Købmand' },
  '365':                    { dot:'#4CAF50', bg:'#E8F5E9', tx:'#2E7D32', name:'365 Discount' },
};
const sm = s => STORE_META[s] || { dot:'#8E8E93', bg:'#F2F2F7', tx:'#3C3C43', name: s||'Ukendt' };

/* ─────────────────────────────────────────
   Virtual scroll
───────────────────────────────────────── */
function useVS(items, ih=80, ch=520) {
  const [st, setSt] = useState(0);
  const ref = useRef(null);
  const onScroll = useCallback(e => setSt(e.target.scrollTop), []);
  const start = Math.max(0, Math.floor(st/ih)-4);
  const end   = Math.min(items.length-1, Math.ceil((st+ch)/ih)+4);
  return { visible:items.slice(start,end+1), offsetY:start*ih, totalH:items.length*ih, ref, onScroll };
}

/* ─────────────────────────────────────────
   useProducts
───────────────────────────────────────── */
function useProducts() {
  const [dbReady, setDbReady]   = useState(false);
  const [total, setTotal]       = useState(0);
  const [loading, setLoading]   = useState(true);
  const [updated, setUpdated]   = useState(null);
  const [products, setProducts] = useState([]);
  const [err, setErr]           = useState(false);

  useEffect(() => { init(); }, []);

  async function init() {
    try {
      await window.ProductDB.init();
      const n = await window.ProductDB.count();
      if (n > 0) {
        setTotal(n); setDbReady(true); setLoading(false);
        setUpdated(new Date().toLocaleString('da-DK'));
        bg();
      } else { await dl(); }
    } catch(e) { console.error(e); setErr(true); setLoading(false); }
  }

  async function dl() {
    try {
      const res = await fetch(DATA_URL+'?t='+Date.now());
      if(!res.ok) throw new Error('HTTP '+res.status);
      const buf  = await res.arrayBuffer();
      const wb   = XLSX.read(buf);
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      const isIOS = /iPhone|iPod/.test(navigator.userAgent);
      const ps = rows.slice(0, isIOS ? 1000 : rows.length).map(r => ({
        id:           crypto.randomUUID(),
        title:        r.title || 'Ukendt',
        price:        Number(r.price) || 0,
        category:     r.category || 'Andet',
        store:        r.store || 'Ukendt',
        imageBase64:  r.image_base64 || null,
        remainingDays: r.remaining_days != null ? Number(r.remaining_days) : null,
      }));
      await window.ProductDB.saveProducts(ps);
      setTotal(ps.length); setDbReady(true); setLoading(false);
      setUpdated(new Date().toLocaleString('da-DK'));
    } catch(e) { console.error(e); setErr(true); setLoading(false); }
  }

  async function bg() { try { await dl(); } catch {} }

  const search = useCallback(async (term, opts={}) => {
    if(!dbReady) return;
    const r = await window.ProductDB.search({
      searchTerm: term,
      category:   opts.category === 'all' ? null : opts.category,
      stores:     opts.stores?.length ? opts.stores : null,
      sortOrder:  opts.sortOrder || 'asc',
      limit: 100,
    });
    setProducts(r);
  }, [dbReady]);

  const getCats   = useCallback(async () => dbReady ? window.ProductDB.getCategories() : [], [dbReady]);
  const getStores = useCallback(async () => dbReady ? window.ProductDB.getStores()     : [], [dbReady]);
  const getByIds  = useCallback(async ids => dbReady ? window.ProductDB.getByIds(ids)  : [], [dbReady]);

  return { dbReady, total, loading, updated, products, err, search, getCats, getStores, getByIds, refresh: dl };
}

/* ─────────────────────────────────────────
   useBasket
───────────────────────────────────────── */
function useBasket() {
  const [basket, setBasket] = useState(() => {
    try { return JSON.parse(localStorage.getItem('beelee_basket')||'[]'); } catch { return []; }
  });
  useEffect(() => { localStorage.setItem('beelee_basket', JSON.stringify(basket)); }, [basket]);

  const add    = useCallback(id => setBasket(prev => {
    const x = prev.find(i=>i.id===id);
    return x ? prev.map(i=>i.id===id?{...i,qty:i.qty+1}:i) : [...prev,{id,qty:1}];
  }), []);
  const remove = useCallback(id => setBasket(prev=>prev.filter(i=>i.id!==id)), []);
  const setQty = useCallback((id,q) => q<=0 ? remove(id) : setBasket(prev=>prev.map(i=>i.id===id?{...i,qty:q}:i)), [remove]);
  const clear  = useCallback(() => setBasket([]), []);
  const inBasket = useCallback(id => basket.some(i=>i.id===id), [basket]);
  const getQty   = useCallback(id => basket.find(i=>i.id===id)?.qty || 0, [basket]);

  return { basket, add, remove, setQty, clear, inBasket, getQty };
}

/* ─────────────────────────────────────────
   LOGIN
───────────────────────────────────────── */
function LoginScreen({ onLogin }) {
  const [u, setU]     = useState(()=>localStorage.getItem('beelee_rem')||'');
  const [p, setP]     = useState('');
  const [rem, setRem] = useState(!!localStorage.getItem('beelee_rem'));
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  const login = async () => {
    if(busy||!u.trim()||!p.trim()){setErr('Udfyld alle felter');return;}
    setBusy(true); setErr('');
    try {
      const res  = await fetch(`${API_URL}/api/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.trim(),password:p.trim()})});
      const data = await res.json();
      if(!res.ok) throw new Error(data.error||'Login fejlede');
      localStorage.setItem('beelee_token', data.token);
      localStorage.setItem('beelee_user', JSON.stringify(data.user));
      if(rem) localStorage.setItem('beelee_rem', u.trim());
      else    localStorage.removeItem('beelee_rem');
      onLogin(data.user);
    } catch(e){setErr(e.message); setBusy(false);}
  };

  return (
    <div className="login-bg" style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style={{width:'100%',maxWidth:360}}>

        {/* Logo */}
        <div style={{textAlign:'center',marginBottom:40}}>
          <div style={{fontSize:64,marginBottom:8}}>🐝</div>
          <h1 style={{color:'white',fontSize:32,fontWeight:700,margin:0,letterSpacing:'-.5px'}}>Beelee</h1>
          <p style={{color:'rgba(255,255,255,.45)',fontSize:15,margin:'6px 0 0'}}>Smart indkøb i Danmark</p>
        </div>

        {/* Fields */}
        <div style={{display:'flex',flexDirection:'column',gap:12,marginBottom:16}}>
          <input className="login-field" type="text" placeholder="Brugernavn" value={u}
            onChange={e=>setU(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()}
            autoCapitalize="none" autoCorrect="off" />
          <input className="login-field" type="password" placeholder="Adgangskode" value={p}
            onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()} />
        </div>

        {/* Remember me */}
        <label style={{display:'flex',alignItems:'center',gap:8,color:'rgba(255,255,255,.6)',fontSize:14,marginBottom:20,cursor:'pointer'}}>
          <input type="checkbox" checked={rem} onChange={e=>setRem(e.target.checked)} style={{width:16,height:16,accentColor:'#3478F6'}} />
          Husk mig
        </label>

        {err && <p style={{color:'#FF453A',fontSize:14,marginBottom:12,textAlign:'center'}}>{err}</p>}

        {/* Login button */}
        <button type="button" onClick={login} disabled={busy} style={{
          width:'100%',padding:'16px',borderRadius:14,
          background:'#3478F6',color:'white',
          fontSize:17,fontWeight:600,letterSpacing:'-.2px',
          opacity:busy?.6:1,transition:'opacity .15s'
        }}>
          {busy
            ? <span style={{display:'inline-block',width:18,height:18,border:'2px solid rgba(255,255,255,.4)',borderTopColor:'white',borderRadius:'50%'}} className="spin-ani"></span>
            : 'Log ind'
          }
        </button>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   PRODUCT ROW  (Things 3 list item style)
───────────────────────────────────────── */
function ProductRow({ product, inBasket, onAdd, qty }) {
  const meta = sm(product.store);
  const [justAdded, setJustAdded] = useState(false);

  const handleAdd = () => {
    onAdd(product.id);
    if (!inBasket) { setJustAdded(true); setTimeout(()=>setJustAdded(false), 600); }
  };

  return (
    <div className="t3-row" style={{display:'flex',alignItems:'center',gap:12,padding:'11px 16px',background:'white',minHeight:72}}>

      <div style={{width:44,height:44,borderRadius:10,overflow:'hidden',background:'#F2F2F7',flexShrink:0}}>
        {product.imageBase64
          ? <img src={product.imageBase64} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}} loading="lazy"/>

        </p>
        <div style={{display:'flex',alignItems:'center',gap:6,marginTop:3,flexWrap:'wrap'}}>
          {/* Store dot + name */}
          <span style={{display:'flex',alignItems:'center',gap:4}}>
            <span style={{width:7,height:7,borderRadius:'50%',background:meta.dot,flexShrink:0}}></span>

          <span style={{color:'var(--label4)',fontSize:13}}>·</span>

          {/* Days left badge */}
          {product.remainingDays != null && (
            <span style={{
              background:'#FFF3E0',color:'#E65100',
              fontSize:11,fontWeight:700,borderRadius:6,
              padding:'1px 6px',letterSpacing:'.02em'
            }}>

            </span>

        </div>
      </div>

      {/* Price + add circle */}

        </span>

        {/* Things 3-style completion circle */}
        <button type="button" onClick={handleAdd}
          style={{
            width:28,height:28,borderRadius:'50%',
            border: inBasket ? 'none' : '2px solid #C7C7CC',
            background: inBasket ? '#3478F6' : 'transparent',
            display:'flex',alignItems:'center',justifyContent:'center',
            transition:'all .2s cubic-bezier(.34,1.56,.64,1)',
            transform: justAdded ? 'scale(1.2)' : 'scale(1)',
          }}>
          {inBasket
            ? <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            : <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#C7C7CC" strokeWidth="2.5" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>
          }
        </button>

        {/* Qty badge if > 1 */}
        {qty > 1 && (
          <span style={{fontSize:10,fontWeight:700,color:'#3478F6',marginTop:-4}}>×{qty}</span>
        )}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   PRODUCTS TAB
───────────────────────────────────────── */
function ProductsTab({ products, dbReady, total, loading, search, getCats, getStores, basket, onAdd, inBasket, getQty }) {
  const [term, setTerm]       = useState('');
  const [selCat, setSelCat]   = useState('all');
  const [selStores, setSel]   = useState([]);
  const [sort, setSort]       = useState('asc');
  const [cats, setCats]       = useState([]);
  const [allStores, setAll]   = useState([]);
  const [showFilters, setShowFilters] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => {
    if (!dbReady) return;
    getCats().then(setCats);
    getStores().then(setAll);
    search('', { category:'all', stores:[], sortOrder:'asc' });
  }, [dbReady]);

  useEffect(() => {
    if (!dbReady) return;
    const t = setTimeout(() => search(term, { category:selCat, stores:selStores, sortOrder:sort }), 220);
    return () => clearTimeout(t);
  }, [term, selCat, selStores, sort, dbReady]);

  const toggleStore = s => setSel(prev => prev.includes(s)?prev.filter(x=>x!==s):[...prev,s]);

  const { visible, offsetY, totalH, ref, onScroll } = useVS(products, 80, 500);

  return (
    <div style={{display:'flex',flexDirection:'column',gap:0}}>

      {/* Search bar */}
      <div style={{padding:'12px 16px 8px'}}>
        <div className="t3-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--label3)" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input ref={inputRef} type="text" placeholder="Søg produkter..." value={term}
            onChange={e=>setTerm(e.target.value)} disabled={!dbReady} />
          {term && (
            <button type="button" onClick={()=>setTerm('')} style={{color:'var(--label3)',fontSize:16,lineHeight:1}}>×</button>
          )}
        </div>
      </div>

      {/* Store pills (horizontal scroll) */}
      {allStores.length > 0 && (
        <div style={{overflowX:'auto',display:'flex',gap:8,padding:'4px 16px 12px',scrollbarWidth:'none'}}>
          <style>{`.pills-scroll::-webkit-scrollbar{display:none}`}</style>
          <div className="pills-scroll" style={{display:'flex',gap:7,paddingBottom:2}}>
            {allStores.map(s => {
              const m = sm(s);
              const active = selStores.includes(s);
              return (
                <button type="button" key={s} onClick={()=>toggleStore(s)}
                  className="store-pill"
                  style={{
                    background: active ? m.bg : 'var(--surface)',
                    color: active ? m.tx : 'var(--label3)',
                    boxShadow: active ? 'none' : '0 1px 3px rgba(0,0,0,.08)',
                    borderColor: active ? m.dot : 'transparent',
                  }}>
                  <span style={{width:6,height:6,borderRadius:'50%',background:m.dot,flexShrink:0}}></span>
                  {m.name}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* Sort + category filter row */}
      <div style={{display:'flex',gap:8,padding:'0 16px 12px',alignItems:'center'}}>
        <div style={{flex:1,position:'relative'}}>
          <select value={selCat} onChange={e=>setSelCat(e.target.value)}
            style={{width:'100%',padding:'7px 28px 7px 12px',borderRadius:9,border:'none',background:'rgba(118,118,128,.12)',fontSize:14,color:'var(--label)',appearance:'none',outline:'none'}}>
            <option value="all">Alle kategorier</option>
            {cats.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <span style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'var(--label3)',fontSize:10}}>▼</span>
        </div>
        <button type="button" onClick={()=>setSort(o=>o==='asc'?'desc':'asc')}
          style={{padding:'7px 12px',borderRadius:9,background:'rgba(118,118,128,.12)',fontSize:14,color:'var(--label)',fontWeight:500,whiteSpace:'nowrap'}}>
          {sort==='asc'?'↑ Billigst':'↓ Dyreste'}
        </button>
        {selStores.length > 0 && (
          <button type="button" onClick={()=>setSel([])}
            style={{padding:'7px 10px',borderRadius:9,background:'#FEE2E2',color:'#DC2626',fontSize:13,fontWeight:600}}>
            Ryd
          </button>
        )}
      </div>

      {/* Status line */}
      {loading ? (
        <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 16px 12px',color:'var(--label3)',fontSize:13}}>
          <span style={{display:'inline-block',width:14,height:14,border:'2px solid #E5E5EA',borderTopColor:'#3478F6',borderRadius:'50%'}} className="spin-ani"></span>
          Indlæser produkter...
        </div>
      ) : dbReady && products.length > 0 && (
        <p style={{fontSize:13,color:'var(--label3)',padding:'0 16px 10px',margin:0}}>
          {products.length} resultater · {total.toLocaleString()} i alt
        </p>
      )}

      {/* Product list */}
      {products.length > 0 ? (
        <div className="t3-section" style={{margin:'0 16px 100px'}}>
          <div ref={ref} onScroll={onScroll} style={{height:500,overflowY:'auto',position:'relative'}}>
            <div style={{height:totalH,position:'relative'}}>
              <div style={{transform:`translateY(${offsetY}px)`,position:'absolute',width:'100%'}}>
                {visible.map(p => (
                  <ProductRow key={p.id} product={p}
                    inBasket={inBasket(p.id)} qty={getQty(p.id)} onAdd={onAdd} />
                ))}
              </div>
            </div>
          </div>
        </div>
      ) : dbReady && !loading && (
        <div style={{textAlign:'center',padding:'60px 24px',color:'var(--label3)'}}>
          <p style={{fontSize:40,margin:'0 0 12px'}}>🔍</p>
          <p style={{fontSize:17,fontWeight:600,color:'var(--label2)',margin:'0 0 6px'}}>Ingen resultater</p>
          <p style={{fontSize:15,margin:0}}>Prøv et andet søgeord</p>
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────
   BASKET TAB
───────────────────────────────────────── */
function BasketTab({ basket, getByIds, setQty, remove, clear }) {
  const [pMap, setPMap] = useState({});

  useEffect(() => {
    if (!basket.length) { setPMap({}); return; }
    getByIds(basket.map(i=>i.id)).then(items => {
      const m={};items.forEach(p=>{if(p)m[p.id]=p;});setPMap(m);
    });
  }, [basket]);

  const total    = basket.reduce((s,i)=>s+(pMap[i.id]?.price||0)*i.qty, 0);
  const itemsQty = basket.reduce((s,i)=>s+i.qty, 0);

  const groups = useMemo(() => {
    const g={};
    basket.forEach(item => {
      const p = pMap[item.id]; if(!p) return;
      if(!g[p.store]) g[p.store]=[];
      g[p.store].push({...item, product:p});
    });
    return g;
  }, [basket, pMap]);

  const share = () => {
    let text='🐝 Beelee kurv\n\n';
    Object.entries(groups).forEach(([store,items])=>{
      text+=`📍 ${sm(store).name}\n`;
      items.forEach(({product,qty})=>{ text+=`• ${product.title} ×${qty}  ${(product.price*qty).toFixed(2)} kr\n`; });
      text+=`Subtotal: ${items.reduce((s,{product,qty})=>s+product.price*qty,0).toFixed(2)} kr\n\n`;
    });
    text+=`TOTAL: ${total.toFixed(2)} kr`;
    if(navigator.share) navigator.share({title:'Beelee kurv',text});
    else navigator.clipboard?.writeText(text).then(()=>alert('Kopieret!'));
  };

  if (!basket.length) return (
    <div style={{textAlign:'center',padding:'80px 24px',color:'var(--label3)'}}>
      <div style={{fontSize:52,marginBottom:16}}>🛒</div>
      <p style={{fontSize:20,fontWeight:600,color:'var(--label2)',margin:'0 0 8px'}}>Kurven er tom</p>
      <p style={{fontSize:15,margin:0}}>Tilføj produkter fra søgning</p>
    </div>
  );

  return (
    <div style={{paddingBottom:120}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 20px 16px'}}>
        <div>
          <p style={{margin:0,fontSize:13,color:'var(--label3)'}}>{itemsQty} varer</p>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button type="button" onClick={share}
            style={{padding:'7px 14px',borderRadius:20,background:'#E8F0FB',color:'#3478F6',fontSize:14,fontWeight:600}}>
            Del 📤
          </button>
          <button type="button" onClick={clear}
            style={{padding:'7px 14px',borderRadius:20,background:'#FEE2E2',color:'#DC2626',fontSize:14,fontWeight:600}}>
            Ryd
          </button>
        </div>
      </div>

      {/* Store groups */}
      {Object.entries(groups).map(([store,items]) => {
        const meta = sm(store);
        const sub  = items.reduce((s,{product,qty})=>s+product.price*qty,0);
        return (
          <div key={store} style={{margin:'0 16px 20px'}}>
            {/* Section header */}
            <div className="t3-section-header" style={{display:'flex',alignItems:'center',gap:6,paddingLeft:4}}>
              <span style={{width:6,height:6,borderRadius:'50%',background:meta.dot}}></span>
              {meta.name.toUpperCase()}
            </div>

            {/* Items */}
            <div className="t3-section">
              {items.map(({id, product, qty}) => (
                <div key={id} className="t3-row"
                  style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',background:'white'}}>
                  {/* Image */}
                  <div style={{width:40,height:40,borderRadius:8,overflow:'hidden',background:'#F2F2F7',flexShrink:0}}>
                    {product.imageBase64
                      ? <img src={product.imageBase64} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                      : <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center'}}>🛒</div>}
                  </div>
                  {/* Title */}
                  <div style={{flex:1,minWidth:0}}>
                    <p style={{margin:0,fontSize:15,fontWeight:500,color:'var(--label)',
                      overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{product.title}</p>
                    <p style={{margin:'2px 0 0',fontSize:13,color:'var(--label3)'}}>{product.price.toFixed(2)} kr/stk</p>
                  </div>
                  {/* Stepper */}
                  <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
                    <button type="button" onClick={()=>setQty(id,qty-1)}
                      className="stepper-btn" style={{background:'#F2F2F7',color:'var(--label2)'}}>−</button>
                    <span style={{fontSize:15,fontWeight:600,width:20,textAlign:'center'}}>{qty}</span>
                    <button type="button" onClick={()=>setQty(id,qty+1)}
                      className="stepper-btn" style={{background:'#EEF3FE',color:'#3478F6'}}>+</button>
                    <button type="button" onClick={()=>remove(id)} style={{marginLeft:4,color:'#C7C7CC'}}>
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    </button>
                  </div>
                  {/* Line total */}
                  <p style={{margin:0,fontSize:15,fontWeight:700,color:'var(--label)',minWidth:56,textAlign:'right'}}>
                    {(product.price*qty).toFixed(2)}<span style={{fontSize:11,color:'var(--label3)',fontWeight:400}}>kr</span>
                  </p>
                </div>
              ))}

              {/* Subtotal row */}
              <div className="t3-row" style={{display:'flex',justifyContent:'space-between',padding:'10px 16px',background:'#F9F9FB'}}>
                <span style={{fontSize:14,color:'var(--label3)',fontWeight:500}}>Subtotal</span>
                <span style={{fontSize:14,fontWeight:700,color:'var(--label)'}}>{sub.toFixed(2)} kr</span>
              </div>
            </div>
          </div>
        );
      })}

      {/* Total footer */}
      <div style={{
        position:'fixed',bottom:0,left:0,right:0,
        background:'rgba(255,255,255,.92)',
        backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',
        borderTop:'1px solid var(--sep-light)',
        padding:'14px 20px',paddingBottom:'calc(14px + env(safe-area-inset-bottom,0px))',
        zIndex:90
      }}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',maxWidth:640,margin:'0 auto'}}>
          <div>
            <p style={{margin:0,fontSize:13,color:'var(--label3)'}}>Total</p>
            <p style={{margin:0,fontSize:26,fontWeight:700,color:'var(--label)',letterSpacing:'-.5px'}}>
              {total.toFixed(2)} <span style={{fontSize:16,fontWeight:500,color:'var(--label3)'}}>kr</span>
            </p>
          </div>
          <button type="button" onClick={share}
            style={{padding:'14px 24px',borderRadius:14,background:'#3478F6',color:'white',fontSize:16,fontWeight:600,letterSpacing:'-.2px'}}>
            Del kurv 📤
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   APP
───────────────────────────────────────── */
function App() {
  const [tab, setTab]   = useState('products');
  const [user, setUser] = useState(() => {
    try { const t=localStorage.getItem('beelee_token'),u=localStorage.getItem('beelee_user'); return t&&u?JSON.parse(u):null; } catch{return null;}
  });

  const { dbReady, total, loading, updated, products, err, search, getCats, getStores, getByIds, refresh } = useProducts();
  const { basket, add, remove, setQty, clear, inBasket, getQty } = useBasket();

  if (!user) return <LoginScreen onLogin={setUser} />;

  const logout = () => { ['beelee_token','beelee_user'].forEach(k=>localStorage.removeItem(k)); setUser(null); };
  const basketCount = basket.reduce((s,i)=>s+i.qty, 0);

  return (
    <div style={{background:'var(--bg)',minHeight:'100vh'}}>

      {/* Large title header */}
      <div style={{
        background:'rgba(242,242,247,.88)',
        backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',
        borderBottom:'1px solid var(--sep-light)',
        padding:'52px 20px 12px',
        position:'sticky',top:0,zIndex:50,
      }}>
        <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',maxWidth:640,margin:'0 auto'}}>
          <div>
            <p style={{margin:0,fontSize:12,color:'var(--label3)',fontWeight:500,letterSpacing:'.04em',textTransform:'uppercase'}}>
              {tab === 'products' ? 'Produkter' : 'Kurv'}
            </p>
            <h1 style={{margin:'2px 0 0',fontSize:30,fontWeight:700,color:'var(--label)',letterSpacing:'-.5px',lineHeight:1.1}}>
              {tab === 'products' ? '🐝 Beelee' : `🛒 Kurv`}
            </h1>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            {!loading && updated && (
              <button type="button" onClick={refresh}
                style={{width:32,height:32,borderRadius:'50%',background:'rgba(118,118,128,.12)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--label3)',fontSize:16}}>
                ↻
              </button>
            )}
            <button type="button" onClick={logout}
              style={{fontSize:14,color:'#3478F6',fontWeight:500}}>
              {user.name||user.id}
            </button>
          </div>
        </div>
      </div>

      {/* Content */}
      <div style={{maxWidth:640,margin:'0 auto',paddingTop:8}}>
        {tab==='products' && (
          <ProductsTab
            products={products} dbReady={dbReady} total={total} loading={loading}
            search={search} getCats={getCats} getStores={getStores}
            basket={basket} onAdd={add} inBasket={inBasket} getQty={getQty}
          />
        )}
        {tab==='basket' && (
          <BasketTab basket={basket} getByIds={getByIds} setQty={setQty} remove={remove} clear={clear} />
        )}
      </div>

      {/* Things 3-style tab bar */}
      <nav className="t3-tabbar safe-bottom">
        <div style={{display:'flex',maxWidth:640,margin:'0 auto',width:'100%'}}>

          {/* Products tab */}
          <button type="button" className={`t3-tab ${tab==='products'?'active':''}`} onClick={()=>setTab('products')}>
            <svg viewBox="0 0 24 24" fill={tab==='products'?'#3478F6':'none'} stroke={tab==='products'?'#3478F6':'#8E8E93'} strokeWidth="1.8" strokeLinecap="round">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
            </svg>
            Søg
          </button>

          {/* Basket tab */}
          <button type="button" className={`t3-tab ${tab==='basket'?'active':''}`}
            onClick={()=>setTab('basket')} style={{position:'relative'}}>
            <svg viewBox="0 0 24 24" fill={tab==='basket'?'#3478F6':'none'} stroke={tab==='basket'?'#3478F6':'#8E8E93'} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            {basketCount > 0 && <span className="badge">{basketCount > 99?'99+':basketCount}</span>}
            Kurv
          </button>

        </div>
      </nav>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
