  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>{
        // Relative path — works at a domain root AND under a GitHub Pages
        // subpath like /beelee/. An absolute '/service-worker.js' 404s there.
        navigator.serviceWorker.register('./service-worker.js')
          .then(r=>console.log('SW registered, scope:',r.scope))
          .catch(e=>console.warn('SW registration failed:',e));
      });
    }
  </script>

  <script>
    (function(){
      if(typeof window==='undefined')return;
      const DB='BeeleeProductsDB',V=2,ST='products';
      window.ProductDB={
        db:null,
        async init(){
          if(this.db)return this.db;
          return new Promise((res,rej)=>{
            const r=indexedDB.open(DB,V);
            r.onerror=()=>rej(r.error);
            r.onsuccess=()=>{this.db=r.result;res(this.db);};
            r.onupgradeneeded=e=>{
              const db=e.target.result;
              if(!db.objectStoreNames.contains(ST)){
                const os=db.createObjectStore(ST,{keyPath:'id'});
                os.createIndex('category','category',{unique:false});
                os.createIndex('subcategory','subcategory',{unique:false});
                os.createIndex('store','store',{unique:false});
              }
            };
          });
        },
        async saveProducts(ps){
          const tx=this.db.transaction(ST,'readwrite'),os=tx.objectStore(ST);
          os.clear();for(const p of ps)os.put(p);
          return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});
        },
        async count(){
          const tx=this.db.transaction(ST,'readonly');
          return new Promise((res,rej)=>{const r=tx.objectStore(ST).count();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
        },
        async search({searchTerm='',category=null,subcategory=null,stores=null,sortOrder='asc',limit=100}={}){
          const tx=this.db.transaction(ST,'readonly');
          return new Promise((res,rej)=>{
            const r=tx.objectStore(ST).getAll();
            r.onsuccess=()=>{
              let all=r.result.filter(p=>{
                const ms=!searchTerm||p.title.toLowerCase().includes(searchTerm.toLowerCase());
                const mc=!category||p.category===category;
                const msub=!subcategory||p.subcategory===subcategory;
                const mst=!stores||!stores.length||stores.includes(p.store);
                return ms&&mc&&msub&&mst;
              });
              all.sort((a,b)=>sortOrder==='asc'?a.price-b.price:b.price-a.price);
              res(all.slice(0,limit));
            };
            r.onerror=()=>rej(r.error);
          });
        },
        async getByIds(ids){
          const tx=this.db.transaction(ST,'readonly'),os=tx.objectStore(ST);
          return Promise.all(ids.map(id=>new Promise(res=>{
            const r=os.get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);
          })));
        },
        async getOffers(limit=20){
          const all=await this.search({searchTerm:'',limit:2000});
          return all.filter(p=>p.remainingDays!=null).slice(0,limit);
        },
        async getCategories(){
          const tx=this.db.transaction(ST,'readonly'),cats=new Set();
          return new Promise((res,rej)=>{
            const r=tx.objectStore(ST).index('category').openCursor();
            r.onsuccess=e=>{const c=e.target.result;if(c){cats.add(c.value.category);c.continue();}else res([...cats].filter(Boolean).sort());};
            r.onerror=()=>rej(r.error);
          });
        },
        async getSubcategories(category){
          const tx=this.db.transaction(ST,'readonly');
          return new Promise((res,rej)=>{
            const r=tx.objectStore(ST).getAll();
            r.onsuccess=()=>{
              const counts={};
              r.result.forEach(p=>{
                if(category&&p.category!==category)return;
                const s=p.subcategory;
                if(!s)return;
                counts[s]=(counts[s]||0)+1;
              });
              res(Object.entries(counts)
                .filter(([,n])=>n>=3)
                .sort((a,b)=>b[1]-a[1])
                .map(([name,count])=>({name,count})));
            };
            r.onerror=()=>rej(r.error);
          });
        },
        async getStores(){
          const tx=this.db.transaction(ST,'readonly'),stores=new Set();
          return new Promise((res,rej)=>{
            const r=tx.objectStore(ST).index('store').openCursor();
            r.onsuccess=e=>{const c=e.target.result;if(c){stores.add(c.value.store);c.continue();}else res([...stores].filter(Boolean).sort());};
            r.onerror=()=>rej(r.error);
          });
        },
      };
    })();
  </script>

  <script>
// receipt-engine.js — browser port of parse_receipt.py + match_receipt_items.py
//
// Runs on-device so receipt images never leave the phone.
// Kept behaviourally identical to the Python versions; the test suite at the
// bottom mirrors theirs case for case.

(function (global) {
  'use strict';

  // ══════════════════════════════════════════════════════════
  // PARSER
  // ══════════════════════════════════════════════════════════

  const STORE_PATTERNS = [
    [/rema\s*1000/i,               'Rema1000'],
    [/\bnetto\b/i,                 'Netto'],
    [/\blidl\b/i,                  'Lidl'],
    [/f[øo0]tex/i,                 'Føtex'],
    [/\bbilka\b/i,                 'Bilka'],
    [/\bmeny\b/i,                  'Meny'],
    [/superbrugsen/i,              'SuperBrugsen & Kvickly'],
    [/kvickly/i,                   'SuperBrugsen & Kvickly'],
    [/d[ae]gli.?brugsen/i,         'Brugsen'],
    [/\bbrugsen\b/i,               'Brugsen'],
    [/365\s*discount|coop\s*365/i, '365'],
    [/\bspar\b/i,                  'Spar'],
    [/min\s*k[øo]bmand/i,          'Min Kobmand'],
  ];

  const SKIP_RE = new RegExp([
    /^\s*i\s*alt\b/, /^\s*total\b/, /^\s*subtotal\b/,
    /^\s*at\s*betale\b/, /^\s*betalt\b/, /^\s*betaling\b/,
    /\bmoms\b/, /\bvat\b/,
    /^\s*dankort\b/, /^\s*visa\b/, /^\s*mastercard\b/,
    /^\s*kontant\b/, /^\s*mobilepay\b/, /^\s*byttepenge\b/,
    /\bcvr\b/, /\bkvittering\b/, /^\s*bon\b/, /\bbonnr\b/,
    /\bkassenr\b/, /\bekspedient\b/, /\bterminal\b/,
    /\bafrunding\b/, /\breturneres\b/, /\bbyttes\b/,
    /\btak for bes[øo]get\b/, /\bvel m[øo]dt\b/,
    /\bmedlemsnr\b/, /\bkundenr\b/, /\bbonuspoint\b/,
    /^\s*[-=_*]{3,}\s*$/,
  ].map(r => r.source).join('|'), 'i');

  const PANT_RE  = /^\s*pant\b/i;
  const RABAT_RE = /\b(rabat|tilbud|besparelse|medlemspris)\b/i;

  const ITEM_RE       = /^\s*(.+?)\s{2,}(-?\d{1,4}[.,]\d{2})\s*[A-Z]?\s*$/;
  const ITEM_LOOSE_RE = /^\s*([A-Za-zÆØÅæøå][^\d]{2,40}?)\s+(-?\d{1,4}[.,]\d{2})\s*[A-Z]?\s*$/;
  const QTY_RE        = /^\s*(\d{1,3})\s*(?:x|stk\.?\s*[aà]?|\*)\s*(\d{1,4}[.,]\d{2})\s*$/i;
  const WEIGHT_RE     = /^\s*(\d{1,3}[.,]\d{1,3})\s*(kg|g|l|ml)\s*(?:x|\*)\s*(\d{1,4}[.,]\d{2})/i;
  const NAME_WEIGHT_RE= /^\s*([A-Za-zÆØÅæøå][^\d]{2,40}?)\s{2,}(\d{1,3}[.,]\d{1,3})\s*(kg|g|l|ml)\s*(?:x|\*)\s*(\d{1,4}[.,]\d{2})\s*$/i;
  const BARE_PRICE_RE = /^\s*(-?\d{1,4}[.,]\d{2})\s*[A-Z]?\s*$/;
  const DATE_RE       = /(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/;

  function num(s) {
    s = String(s);
    return (s.split(',').length - 1) === 1
      ? parseFloat(s.replace(/\./g, '').replace(',', '.'))
      : parseFloat(s.replace(/,/g, ''));
  }

  function detectStore(lines) {
    const head = lines.slice(0, 12).join(' ');
    for (const [re, store] of STORE_PATTERNS) if (re.test(head)) return store;
    return null;
  }

  function detectDate(lines) {
    const scan = lines.slice(0, 20).concat(lines.slice(-20));
    for (const line of scan) {
      const m = DATE_RE.exec(line);
      if (!m) continue;
      let [, d, mo, y] = m;
      y = parseInt(y, 10); if (y < 100) y += 2000;
      const dt = new Date(y, parseInt(mo, 10) - 1, parseInt(d, 10));
      if (dt.getFullYear() === y && dt.getMonth() === parseInt(mo, 10) - 1
          && y >= 2020 && y <= new Date().getFullYear() + 1) {
        const p = n => String(n).padStart(2, '0');
        return `${y}-${p(mo)}-${p(d)}`;
      }
    }
    return null;
  }

  function parseReceipt(text) {
    const lines = String(text || '').split(/\r?\n/)
      .map(l => l.replace(/\s+$/, '')).filter(l => l.trim());

    const store = detectStore(lines);
    const date  = detectDate(lines);

    const items = [], skipped = [], warnings = [];
    let deposits = 0, discounts = 0;

    let end = lines.length;
    for (let i = 0; i < lines.length; i++) {
      if (/^\s*(i\s*alt|total|at\s*betale)\b/i.test(lines[i])) { end = i; break; }
    }

    let i = 0;
    while (i < end) {
      const line = lines[i];

      if (SKIP_RE.test(line)) { skipped.push(line.trim()); i++; continue; }

      // Weighted goods where the total is on the next line
      const nw = NAME_WEIGHT_RE.exec(line);
      if (nw && i + 1 < end) {
        const bp = BARE_PRICE_RE.exec(lines[i + 1]);
        if (bp) {
          items.push({
            name: nw[1].replace(/\s{2,}/g, ' ').replace(/^[\s.\-*]+|[\s.\-*]+$/g, '').toUpperCase(),
            line_total: Math.round(num(bp[1]) * 100) / 100,
            qty: 1,
            unit_price: Math.round(num(nw[4]) * 100) / 100,
            kind: 'weighted',
          });
          i += 2; continue;
        }
      }

      const m = ITEM_RE.exec(line) || ITEM_LOOSE_RE.exec(line);
      if (!m) { skipped.push(line.trim()); i++; continue; }

      const name = m[1].replace(/\s{2,}/g, ' ').replace(/^[\s.\-*]+|[\s.\-*]+$/g, '');
      const total = num(m[2]);
      if (!isFinite(total)) { skipped.push(line.trim()); i++; continue; }

      if (PANT_RE.test(name))  { deposits  += total; i++; continue; }
      if (RABAT_RE.test(name) || total < 0) { discounts += total; i++; continue; }
      if (name.replace(/[^A-Za-zÆØÅæøå]/g, '').length < 3) {
        skipped.push(line.trim()); i++; continue;
      }

      let qty = 1, unitPrice = total, kind = 'item';
      if (i + 1 < end) {
        const nxt = lines[i + 1];
        const qm = QTY_RE.exec(nxt), wm = WEIGHT_RE.exec(nxt);
        if (qm)      { qty = parseInt(qm[1], 10); unitPrice = num(qm[2]); i++; }
        else if (wm) { kind = 'weighted'; unitPrice = num(wm[3]); i++; }
      }

      items.push({
        name: name.toUpperCase(),
        line_total: Math.round(total * 100) / 100,
        qty, unit_price: Math.round(unitPrice * 100) / 100, kind,
      });
      i++;
    }

    if (!store)        warnings.push('Butik ikke genkendt');
    if (!items.length) warnings.push('Ingen varelinjer fundet');

    let printedTotal = null;
    for (const line of lines.slice(end, end + 6)) {
      if (/^\s*(i\s*alt|total|at\s*betale)\b/i.test(line)) {
        const m = /(\d{1,4}[.,]\d{2})/.exec(line);
        if (m) { printedTotal = num(m[1]); break; }
      }
    }
    if (printedTotal != null) {
      const summed = items.reduce((s, x) => s + x.line_total, 0) + deposits + discounts;
      if (Math.abs(summed - printedTotal) > 0.5) {
        warnings.push(`Sum stemmer ikke: linjer ${summed.toFixed(2)} vs bon ${printedTotal.toFixed(2)}`);
      }
    }

    return {
      store, date, items,
      deposits: Math.round(deposits * 100) / 100,
      discounts: Math.round(discounts * 100) / 100,
      printed_total: printedTotal, skipped, warnings,
    };
  }

  // ══════════════════════════════════════════════════════════
  // MATCHER
  // ══════════════════════════════════════════════════════════

  const NGRAM_N = 4, NGRAM_WEIGHT = 0.45, MIN_SCORE = 0.30, AMBIGUOUS_GAP = 0.06;

  const ABBREV = [
    [/\bhk\b/g, 'hakket'], [/\boko\b/g, 'okologisk'], [/\bokol\b/g, 'okologisk'],
    [/\bskivost\b/g, 'skiveost'], [/\bfl\b/g, 'flaske'],
    [/\bm\//g, 'med '], [/\bu\//g, 'uden '],
    [/\bkyll\b/g, 'kylling'], [/\bsvine\b/g, 'svinekod'], [/\bokse\b/g, 'oksekod'],
    [/\brugbr\b/g, 'rugbrod'], [/\bmineralv\b/g, 'mineralvand'],
    [/\bchok\b/g, 'chokolade'],
  ];

  const STOPWORDS = new Set([
    'stk','pk','pakke','pose','bakke','flaske','glas','dase',
    'ca','kg','gr','gram','liter','ltr','cl','dl',
    'dansk','danske','frisk','friske','naturel','original',
    'med','uden','og','til','fra','af','the','and',
    'vare','varer','produkt','tilbud','spar','pris',
  ]);

  function foldDanish(s) {
    return s.replace(/æ/g, 'ae').replace(/ø/g, 'o').replace(/å/g, 'aa');
  }

  function normalise(text) {
    let s = String(text || '').toLowerCase();
    s = s.replace(/\./g, ' ').replace(/\//g, ' / ');
    s = foldDanish(s);
    for (const [re, full] of ABBREV) s = s.replace(re, full);
    s = s.replace(/[^\w%\s]/g, ' ');
    return s.split(/\s+/).filter(Boolean).join(' ');
  }

  // OCR confuses these on thermal paper. Repair only inside words that are
  // otherwise letters, so "500G" is still treated as a size and dropped.
  const OCR_MAP = { '0': 'o', '1': 'i', '5': 's', '8': 'b', '6': 'g' };
  function repairOcr(word) {
    const letters = (word.match(/[a-zæøå]/g) || []).length;
    const digits  = (word.match(/\d/g) || []).length;
    if (digits && letters >= 3 && letters > digits)
      return word.replace(/[015 86]/g, c => OCR_MAP[c] || c);
    return word;
  }

  function tokenize(text) {
    const out = [];
    for (let w of normalise(text).split(' ')) {
      w = repairOcr(w);
      if (w.length < 3 || STOPWORDS.has(w)) continue;
      if (/\d/.test(w)) continue;
      for (const suf of ['erne','ene','er','en','et','e']) {
        if (w.length > 5 && w.endsWith(suf)) { w = w.slice(0, -suf.length); break; }
      }
      out.push(w);
    }
    return out;
  }

  function charNgrams(word, n) {
    n = n || NGRAM_N;
    if (word.length <= n) return [word];
    const out = [];
    for (let i = 0; i <= word.length - n; i++) out.push(word.slice(i, i + n));
    return out;
  }

  function buildBag(text) {
    const bag = new Map();
    for (const tok of tokenize(text)) {
      bag.set(tok, (bag.get(tok) || 0) + 1);
      for (const g of charNgrams(tok))
        bag.set('#' + g, (bag.get('#' + g) || 0) + NGRAM_WEIGHT);
    }
    return bag;
  }

  function cosine(a, b, idf) {
    if (!a.size || !b.size) return 0;
    let num = 0;
    for (const [t, va] of a) {
      const vb = b.get(t);
      if (vb === undefined) continue;
      const w = idf.get(t) || 1;
      num += va * vb * w * w;
    }
    if (!num) return 0;
    let na = 0, nb = 0;
    for (const [t, v] of a) { const w = idf.get(t) || 1; na += (v * w) ** 2; }
    for (const [t, v] of b) { const w = idf.get(t) || 1; nb += (v * w) ** 2; }
    return (na && nb) ? num / (Math.sqrt(na) * Math.sqrt(nb)) : 0;
  }

  class ReceiptMatcher {
    constructor(products) {
      this.products = products || [];
      this.bags = this.products.map(p => buildBag(p.title || ''));

      const df = new Map();
      for (const bag of this.bags)
        for (const t of bag.keys()) df.set(t, (df.get(t) || 0) + 1);
      const n = Math.max(1, this.bags.length);
      this.idf = new Map();
      for (const [t, f] of df) this.idf.set(t, Math.log(n / (1 + f)) + 1);

      this.byStore = new Map();
      this.products.forEach((p, i) => {
        const k = p.store;
        if (!this.byStore.has(k)) this.byStore.set(k, []);
        this.byStore.get(k).push(i);
      });
    }

    match(receiptName, store, price) {
      const bag = buildBag(receiptName);
      if (!bag.size) return null;

      const pool = this.byStore.get(store) || this.products.map((_, i) => i);
      const scored = [];
      for (const i of pool) {
        let s = cosine(bag, this.bags[i], this.idf);
        if (s <= 0) continue;
        if (price != null) {
          const pp = parseFloat(this.products[i].price);
          if (isFinite(pp)) {
            const d = Math.abs(pp - parseFloat(price));
            if (d < 0.5) s += 0.12; else if (d < 2.0) s += 0.04;
          }
        }
        scored.push([s, i]);
      }
      if (!scored.length) return null;
      scored.sort((a, b) => b[0] - a[0]);
      if (scored[0][0] < MIN_SCORE) return null;

      const runner = scored[1] || null;
      return {
        product: this.products[scored[0][1]],
        score: Math.round(scored[0][0] * 1000) / 1000,
        ambiguous: !!(runner && (scored[0][0] - runner[0]) < AMBIGUOUS_GAP),
        runner_up: runner ? this.products[runner[1]] : null,
      };
    }

    matchReceipt(parsed, store) {
      store = store || parsed.store;
      return (parsed.items || []).map(item => {
        const hit = this.match(item.name, store, item.unit_price);
        return {
          receipt: item,
          match: hit ? hit.product : null,
          score: hit ? hit.score : 0,
          ambiguous: hit ? hit.ambiguous : false,
          status: hit ? (hit.ambiguous ? 'ambiguous' : 'matched') : 'unmatched',
        };
      });
    }
  }

  // Stable product identity — must match product_key.py byte for byte.
  function productKey(title, barcode){
    if(barcode != null){
      let bc = String(barcode).replace(/\D/g,'').replace(/^0+/,'');
      if(bc.length >= 8) return 'ean:' + bc;
    }
    let s = String(title||'').toLowerCase();
    s = s.replace(/æ/g,'ae').replace(/ø/g,'o').replace(/å/g,'aa');
    s = s.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    return 't:' + (s.slice(0,120) || 'ukendt');
  }

  global.BeeleeReceipt = { parseReceipt, ReceiptMatcher, normalise, tokenize, productKey };

})(typeof window !== 'undefined' ? window : globalThis);


  </script>

  <style>
    *{-webkit-tap-highlight-color:transparent;box-sizing:border-box;}
    body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;background:#F2F2F7;-webkit-font-smoothing:antialiased;}
    #root{width:100%;min-height:100vh;}
    :root{
      --bg:#F2F2F7;--surface:#FFFFFF;--blue:#3478F6;
      --label:#000;--label2:#3C3C43;--label3:#8E8E93;--label4:#C7C7CC;
      --sep:rgba(60,60,67,.18);--green:#34C759;--red:#FF3B30;--orange:#FF9500;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .spin{display:inline-block;width:18px;height:18px;border:2px solid #e5e7eb;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;}
    ::-webkit-scrollbar{display:none}
    .t3-search{background:rgba(118,118,128,.12);border-radius:10px;display:flex;align-items:center;gap:6px;padding:8px 12px;}
    .t3-search input{background:none;border:none;outline:none;font-size:16px;color:var(--label);flex:1;min-width:0;}
    .t3-search input::placeholder{color:var(--label3);}
    .t3-row+.t3-row{border-top:1px solid rgba(60,60,67,.08);}
    .tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid rgba(0,0,0,.1);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom,0);}
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0 4px;gap:2px;font-size:10px;font-weight:500;color:var(--label3);border:none;background:none;cursor:pointer;transition:color .15s;}
    .tab.active{color:var(--blue);}

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

const API_URL  = 'https://beelee-backend.onrender.com';
const DATA_URL = 'https://raw.githubusercontent.com/Jedawg/beelee/main/data/products.xlsx';

const STORE_META = {
  'Rema1000':              {dot:'#003D8F',bg:'#E8F0FB',tx:'#003D8F',name:'REMA 1000'},
  'Netto':                 {dot:'#F9C200',bg:'#FEF8D9',tx:'#7A5F00',name:'NETTO'},
  'Lidl':                  {dot:'#EF3340',bg:'#FDECEA',tx:'#B00020',name:'LIDL'},
  'Føtex':                 {dot:'#0046A0',bg:'#E8EFF9',tx:'#0046A0',name:'FØTEX'},
  'Meny':                  {dot:'#C8102E',bg:'#FCEDEF',tx:'#8B0B1F',name:'MENY'},
  'Brugsen':               {dot:'#E30613',bg:'#FDECEA',tx:'#9A0007',name:'BRUGSEN'},
  'SuperBrugsen & Kvickly':{dot:'#E30613',bg:'#FDECEA',tx:'#9A0007',name:'SUPERBRUGSEN'},
  'Bilka':                 {dot:'#004FA3',bg:'#E8EFF9',tx:'#003570',name:'BILKA'},
  'Spar':                  {dot:'#007A4D',bg:'#E5F4EC',tx:'#004D2E',name:'SPAR'},
  'Min Kobmand':           {dot:'#2D5F2D',bg:'#E5F4EC',tx:'#1A3D1A',name:'MIN KØBMAND'},
  '365':                   {dot:'#4CAF50',bg:'#E8F5E9',tx:'#2E7D32',name:'365 DISCOUNT'},
};
const sm = s => STORE_META[s]||{dot:'#8E8E93',bg:'#F2F2F7',tx:'#3C3C43',name:(s||'').toUpperCase()};

// ── Geolocation + store distances ──
const STORES_URL = 'https://raw.githubusercontent.com/Jedawg/beelee/main/data/stores.json';

// Great-circle distance in metres. Accurate enough at city scale.
function haversine(lat1, lon1, lat2, lon2){
  const R=6371000, rad=Math.PI/180;
  const dLat=(lat2-lat1)*rad, dLon=(lon2-lon1)*rad;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function formatDistance(m){
  if(m==null) return null;
  if(m<1000) return Math.round(m/10)*10 + ' m';
  return (m/1000).toFixed(m<10000?1:0).replace('.',',') + ' km';
}

// Is the shop open right now, per the OSM opening_hours string?
// Deliberately handles only the simple recurring forms Danish shops use.
// Anything with holidays, seasons or off-rules returns null = "don't claim".
function isOpenNow(hours, now=new Date()){
  if(!hours || typeof hours!=='string') return null;
  const h=hours.trim();
  if(/PH|SH|easter|off|\|\||week /i.test(h)) return null;
  if(/^24\/7$/.test(h)) return true;
  const DAYS=['Su','Mo','Tu','We','Th','Fr','Sa'];
  const today=DAYS[now.getDay()];
  const mins=now.getHours()*60+now.getMinutes();
  for(const part of h.split(';')){
    const m=part.trim().match(/^([A-Za-z,\-]+)\s+(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
    if(!m) continue;
    const [,dayspec,h1,m1,h2,m2]=m;
    let matches=false;
    for(const token of dayspec.split(',')){
      if(token.includes('-')){
        const [a,b]=token.split('-');
        const ia=DAYS.indexOf(a), ib=DAYS.indexOf(b), it=DAYS.indexOf(today);
        if(ia<0||ib<0) continue;
        if(ia<=ib ? (it>=ia&&it<=ib) : (it>=ia||it<=ib)) matches=true;
      } else if(token===today) matches=true;
    }
    if(!matches) continue;
    const open=(+h1)*60+(+m1);
    let close=(+h2)*60+(+m2);
    if(close<=open) close+=1440;              // spans midnight
    if(mins>=open && mins<close) return true;
    if(mins+1440>=open && mins+1440<close) return true;
  }
  return false;
}

function useStores(){
  const [coords,setCoords]   = useState(null);
  const [status,setStatus]   = useState('idle');  // idle|asking|ok|denied|unavailable
  const [stores,setStores]   = useState([]);

  // Store list is public data — fetch it regardless of location permission
  useEffect(()=>{
    fetch(STORES_URL)
      .then(r=>r.ok?r.json():null)
      .then(d=>{ if(d?.stores) setStores(d.stores); })
      .catch(()=>{});
  },[]);

  // Remember the last fix so the app isn't blank before permission is granted
  useEffect(()=>{
    try{
      const saved=JSON.parse(localStorage.getItem('beelee_coords')||'null');
      if(saved && Date.now()-saved.t < 86400000){ setCoords(saved); setStatus('ok'); }
    }catch{}
  },[]);

  const locate=useCallback(()=>{
    if(!navigator.geolocation){ setStatus('unavailable'); return; }
    setStatus('asking');
    navigator.geolocation.getCurrentPosition(
      pos=>{
        const c={lat:pos.coords.latitude,lon:pos.coords.longitude,t:Date.now()};
        setCoords(c); setStatus('ok');
        try{ localStorage.setItem('beelee_coords',JSON.stringify(c)); }catch{}
      },
      err=>setStatus(err.code===1?'denied':'unavailable'),
      { enableHighAccuracy:false, timeout:10000, maximumAge:300000 }
    );
  },[]);

  // Nearest branch of each chain, keyed by the store name used in products
  const nearestByChain = useMemo(()=>{
    if(!coords || !stores.length) return {};
    const best={};
    for(const s of stores){
      const d=haversine(coords.lat,coords.lon,s.lat,s.lon);
      if(!best[s.chain] || d<best[s.chain].distance)
        best[s.chain]={...s,distance:d};
    }
    return best;
  },[coords,stores]);

  const clearLocation=useCallback(()=>{
    setCoords(null); setStatus('idle');
    try{ localStorage.removeItem('beelee_coords'); }catch{}
  },[]);

  // ── In-store detection ──
  // Indoor GPS is 30-100 m, and central Copenhagen often has several shops
  // inside that error. So we never decide which store you're in — we collect
  // candidates and ask.
  const IN_STORE_RADIUS = 150;   // metres

  const candidates = useMemo(()=>{
    if(!coords || !stores.length) return [];
    return stores
      .map(s=>({...s,distance:haversine(coords.lat,coords.lon,s.lat,s.lon)}))
      .filter(s=>s.distance<=IN_STORE_RADIUS)
      .sort((a,b)=>a.distance-b.distance)
      .slice(0,6);
  },[coords,stores]);

  // The store the user has confirmed they're standing in, if any
  const [activeStore,setActiveStore]=useState(()=>{
    try{
      const v=JSON.parse(localStorage.getItem('beelee_active_store')||'null');
      // A confirmation is only good for two hours — people leave shops
      if(v && Date.now()-v.t < 7200000) return v.store;
    }catch{}
    return null;
  });

  const confirmStore=useCallback(store=>{
    setActiveStore(store);
    try{
      localStorage.setItem('beelee_active_store',
        JSON.stringify({store,t:Date.now()}));
    }catch{}
  },[]);

  const dismissStorePrompt=useCallback(()=>{
    try{ sessionStorage.setItem('beelee_store_dismissed','1'); }catch{}
    setActiveStore(null);
  },[]);

  const leaveStore=useCallback(()=>{
    setActiveStore(null);
    try{
      localStorage.removeItem('beelee_active_store');
      sessionStorage.removeItem('beelee_store_dismissed');
    }catch{}
  },[]);

  // Ask only when we have candidates, nothing confirmed, and the user
  // hasn't already waved the prompt away this session
  const shouldAsk = useMemo(()=>{
    if(activeStore || !candidates.length) return false;
    try{ if(sessionStorage.getItem('beelee_store_dismissed')) return false; }catch{}
    return true;
  },[activeStore,candidates]);

  return{coords,status,stores,nearestByChain,locate,clearLocation,
         candidates,activeStore,shouldAsk,confirmStore,dismissStorePrompt,leaveStore};
}

// ── Virtual scroll ──
function useVS(items,ih=84,ch=520){
  const [st,setSt]=useState(0);
  const ref=useRef(null);
  const onScroll=useCallback(e=>setSt(e.target.scrollTop),[]);
  const start=Math.max(0,Math.floor(st/ih)-4);
  const end=Math.min(items.length-1,Math.ceil((st+ch)/ih)+4);
  return{visible:items.slice(start,end+1),offsetY:start*ih,totalH:items.length*ih,ref,onScroll};
}

// ── useProducts ──
function useProducts(){
  const [dbReady,setDbReady]=useState(false);
  const [total,setTotal]=useState(0);
  const [loading,setLoading]=useState(true);
  const [updated,setUpdated]=useState(null);
  const [products,setProducts]=useState([]);

  useEffect(()=>{init();},[]);

  async function init(){
    try{
      await window.ProductDB.init();
      const n=await window.ProductDB.count();
      if(n>0){setTotal(n);setDbReady(true);setLoading(false);setUpdated(new Date().toLocaleString('da-DK'));bg();}
      else{await dl();}
    }catch(e){console.error(e);setLoading(false);}
  }

  async function dl(){
    try{
      const res=await fetch(DATA_URL+'?t='+Date.now());
      if(!res.ok)throw new Error('HTTP '+res.status);
      const buf=await res.arrayBuffer();
      const rows=XLSX.utils.sheet_to_json(XLSX.read(buf).Sheets[XLSX.read(buf).SheetNames[0]]);
      const isIOS=/iPhone|iPod/.test(navigator.userAgent);
      const ps=rows.slice(0,isIOS?1000:rows.length).map(r=>({
        id:crypto.randomUUID(),
        productKey:r.product_key||window.BeeleeReceipt.productKey(r.title,r.barcode),
        title:r.title||'Ukendt',price:Number(r.price)||0,
        category:r.category||'Andet',subcategory:r.subcategory||'',store:r.store||'Ukendt',
        imageBase64:r.image_base64||null,
        remainingDays:r.remaining_days!=null?Number(r.remaining_days):null,
        nutriscore:r.nutriscore||null,ingredients:r.ingredients||null,
        nutriscoreSource:r.nutriscore_source||null,nutriscoreConf:r.nutriscore_confidence??null,
        allergens:r.allergens||null,nova:r.nova||null,
        energyKcal:r.energy_kcal??null,fat:r.fat??null,satFat:r.sat_fat??null,
        sugars:r.sugars??null,salt:r.salt??null,fiber:r.fiber??null,protein:r.protein??null,
      }));
      await window.ProductDB.saveProducts(ps);
      setTotal(ps.length);setDbReady(true);setLoading(false);
      setUpdated(new Date().toLocaleString('da-DK'));
    }catch(e){console.error(e);setLoading(false);}
  }
  async function bg(){try{await dl();}catch{}}

  const search=useCallback(async(term,opts={})=>{
    if(!dbReady)return;
    const r=await window.ProductDB.search({
      searchTerm:term,
      category:opts.category==='all'?null:opts.category,
      subcategory:opts.subcategory&&opts.subcategory!=='all'?opts.subcategory:null,
      stores:opts.stores?.length?opts.stores:null,
      sortOrder:opts.sortOrder||'asc',
      limit:100,
    });
    setProducts(r);
  },[dbReady]);

  const getCats=useCallback(async()=>dbReady?window.ProductDB.getCategories():[]  ,[dbReady]);
  const getSubs=useCallback(async cat=>dbReady?window.ProductDB.getSubcategories(cat==='all'?null:cat):[],[dbReady]);
  const getStores=useCallback(async()=>dbReady?window.ProductDB.getStores():[]    ,[dbReady]);
  const getByIds=useCallback(async ids=>dbReady?window.ProductDB.getByIds(ids):[]  ,[dbReady]);
  const getOffers=useCallback(async()=>dbReady?window.ProductDB.getOffers(20):[]   ,[dbReady]);

  return{dbReady,total,loading,updated,products,search,getCats,getSubs,getStores,getByIds,getOffers,refresh:dl};
}

// ── useBasket ──
function useBasket(){
  const [basket,setBasket]=useState(()=>{try{return JSON.parse(localStorage.getItem('beelee_basket')||'[]');}catch{return[];}});
  useEffect(()=>{localStorage.setItem('beelee_basket',JSON.stringify(basket));},[basket]);
  const add=useCallback(id=>setBasket(prev=>{
    const x=prev.find(i=>i.id===id);
    return x?prev.map(i=>i.id===id?{...i,qty:i.qty+1}:i):[...prev,{id,qty:1}];
  }),[]);
  const remove=useCallback(id=>setBasket(prev=>prev.filter(i=>i.id!==id)),[]);
  const setQty=useCallback((id,q)=>q<=0?remove(id):setBasket(prev=>prev.map(i=>i.id===id?{...i,qty:q}:i)),[remove]);
  const clear=useCallback(()=>setBasket([]),[]);
  const inBasket=useCallback(id=>basket.some(i=>i.id===id),[basket]);
  const getQty=useCallback(id=>basket.find(i=>i.id===id)?.qty||0,[basket]);
  return{basket,add,remove,setQty,clear,inBasket,getQty};
}

// ── LOGIN ──
function LoginScreen({onLogin}){
  const [u,setU]=useState(()=>localStorage.getItem('beelee_rem')||'');
  const [p,setP]=useState('');
  const [rem,setRem]=useState(!!localStorage.getItem('beelee_rem'));
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);
  const login=async()=>{
    if(busy||!u.trim()||!p.trim()){setErr('Udfyld alle felter');return;}
    setBusy(true);setErr('');
    try{
      const res=await fetch(`${API_URL}/api/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.trim(),password:p.trim()})});
      const data=await res.json();
      if(!res.ok)throw new Error(data.error||'Login fejlede');
      localStorage.setItem('beelee_token',data.token);
      localStorage.setItem('beelee_user',JSON.stringify(data.user));
      if(rem)localStorage.setItem('beelee_rem',u.trim());
      else localStorage.removeItem('beelee_rem');
      onLogin(data.user);
    }catch(e){setErr(e.message);setBusy(false);}
  };
  return(
    <div style={{minHeight:'100vh',background:'linear-gradient(160deg,#1C1C1E,#2C2C2E)',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style={{width:'100%',maxWidth:360}}>
        <div style={{textAlign:'center',marginBottom:40}}>
          <div style={{fontSize:64,marginBottom:8}}>🐝</div>
          <h1 style={{color:'white',fontSize:32,fontWeight:700,margin:0,letterSpacing:'-.5px'}}>Beelee</h1>
          <p style={{color:'rgba(255,255,255,.45)',fontSize:15,margin:'6px 0 0'}}>Smart indkøb i Danmark</p>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:12,marginBottom:16}}>
          <input style={{width:'100%',background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.15)',borderRadius:12,padding:'14px 16px',fontSize:16,color:'white',outline:'none'}}
            type="text" placeholder="Brugernavn" value={u} onChange={e=>setU(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&login()} autoCapitalize="none" autoCorrect="off"/>
          <input style={{width:'100%',background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.15)',borderRadius:12,padding:'14px 16px',fontSize:16,color:'white',outline:'none'}}
            type="password" placeholder="Adgangskode" value={p} onChange={e=>setP(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&login()}/>
        </div>
        <label style={{display:'flex',alignItems:'center',gap:8,color:'rgba(255,255,255,.6)',fontSize:14,marginBottom:20,cursor:'pointer'}}>
          <input type="checkbox" checked={rem} onChange={e=>setRem(e.target.checked)} style={{width:16,height:16,accentColor:'#3478F6'}}/>
          Husk mig
        </label>
        {err&&<p style={{color:'#FF453A',fontSize:14,marginBottom:12,textAlign:'center'}}>{err}</p>}
        <button type="button" onClick={login} disabled={busy}
          style={{width:'100%',padding:16,borderRadius:14,background:'#3478F6',color:'white',border:'none',fontSize:17,fontWeight:600,letterSpacing:'-.2px',opacity:busy?.6:1}}>
          {busy?<span className="spin"/>:'Log ind'}
        </button>
      </div>
    </div>
  );
}

function StoreDistance({chain,nearestByChain}){
  const s = nearestByChain?.[chain];
  if(!s) return null;
  const open = isOpenNow(s.hours);
  return(
    <span style={{fontSize:10,color:'var(--label3)',display:'inline-flex',alignItems:'center',gap:4}}>

      {open===false && <span style={{color:'#C62828'}}>· Lukket</span>}

  );
}

function OkoBadge(){
  return <span style={{background:'#E8F5E9',color:'#2E7D32',fontSize:10,fontWeight:700,borderRadius:5,padding:'2px 5px'}}>🌿 ØKO</span>;
}

const NS_COLORS={A:'#038141',B:'#85BB2F',C:'#FECB02',D:'#EE8100',E:'#E63E11'};
function NutriBadge({grade,source,size='sm'}){
  if(!grade)return null;
  const g=String(grade).toUpperCase();
  const bg=NS_COLORS[g];if(!bg)return null;
  const s=size==='sm'?16:26;
  const est=source&&source!=='official';
  return <span title={est?`Nutri-Score ${g} (estimeret)`:`Nutri-Score ${g}`}
    style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:est?s+6:s,height:s,borderRadius:4,
      background:est?'transparent':bg,color:est?bg:(g==='C'?'#3C3C43':'#fff'),
      border:est?`1.5px dashed ${bg}`:'none',
      fontSize:size==='sm'?10:15,fontWeight:700,flexShrink:0,letterSpacing:est?'-.5px':0}}>
    {est?'~'+g:g}</span>;
}

function NutriScale({grade}){
  const g=String(grade||'').toUpperCase();
  return(
    <div style={{display:'flex',gap:3}}>
      {['A','B','C','D','E'].map(x=>(
        <span key={x} style={{flex:1,textAlign:'center',padding:'6px 0',borderRadius:5,background:NS_COLORS[x],color:x==='C'?'#3C3C43':'#fff',fontSize:x===g?15:12,fontWeight:700,opacity:x===g?1:.35,transform:x===g?'scale(1.08)':'none',transition:'all .2s'}}>{x}</span>
      ))}
    </div>
  );
}

function AddCircle({inBasket,onAdd,qty}){
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,flexShrink:0}}>
      <button type="button" onClick={e=>{e.stopPropagation();onAdd();}}
        className={'add-circle'+(inBasket?' in':'')}
        style={{width:28,height:28,border:'none'}}>
        {inBasket
          ?<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
          :<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--label4)" strokeWidth="2.5" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>
        }
      </button>
      {qty>1&&<span style={{fontSize:9,fontWeight:700,color:'var(--blue)'}}>{qty}</span>}
    </div>
  );
}

// ── PRODUCT DETAIL PANEL ──
function ProductDetail({product,onClose,onAdd,inBasket,qty,getByIds}){
  const [storeComparisons,setStoreComparisons]=useState([]);

  useEffect(()=>{
    if(!product||!window.ProductDB)return;
    // Find same product at other stores by searching title keywords
    const words=product.title
      .split(/\s+/)
      .filter(w=>w.length>2&&!/^\d/.test(w)&&!/^øko\.?$/i.test(w))
      .slice(0,2).join(' ');
    if(!words)return;
    window.ProductDB.search({searchTerm:words,limit:30}).then(results=>{
      const storeMap={};
      // Include current product
      storeMap[product.store]={...product,isCurrent:true};
      results.forEach(p=>{
        if(p.id===product.id)return;
        if(!storeMap[p.store]||p.price<storeMap[p.store].price)
          storeMap[p.store]={...p,isCurrent:false};
      });
      const sorted=Object.values(storeMap).sort((a,b)=>a.price-b.price);
      setStoreComparisons(sorted);
    });
  },[product]);

  if(!product)return null;
  const maxPrice=storeComparisons.length?Math.max(...storeComparisons.map(p=>p.price)):product.price;
  const minPrice=storeComparisons.length?Math.min(...storeComparisons.map(p=>p.price)):product.price;
  const saving=(product.price-minPrice).toFixed(2);
  const isOko=product.category==='Øko'||product.title.toUpperCase().includes('ØKO');

  return(
    <div className="slide-panel" style={{overflowY:'auto',paddingBottom:100}}>
      {/* Header */}
      <div style={{background:'rgba(242,242,247,.9)',backdropFilter:'blur(20px)',padding:'50px 16px 12px',position:'sticky',top:0,zIndex:10}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <button type="button" onClick={onClose} style={{display:'flex',alignItems:'center',gap:4,color:'var(--blue)',fontWeight:500,fontSize:16,background:'none',border:'none'}}>
            <svg width="10" height="16" viewBox="0 0 10 18" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M9 1L1 9l8 8"/></svg>
            Tilbage
          </button>
          {isOko&&<OkoBadge/>}
        </div>
      </div>

      {/* Product header */}
      <div style={{background:'white',padding:'20px 16px',marginBottom:1}}>
        <div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
          <div style={{width:80,height:80,borderRadius:14,background:'#F2F2F7',flexShrink:0,overflow:'hidden',display:'flex',alignItems:'center',justifyContent:'center'}}>
            {product.imageBase64
              ?<img src={product.imageBase64} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
              :<span style={{fontSize:36}}>🛒</span>}
          </div>
          <div style={{flex:1}}>
            <p style={{margin:0,fontSize:18,fontWeight:600,lineHeight:1.3,color:'var(--label)'}}>{product.title}</p>
            <div style={{marginTop:6,display:'flex',gap:4,flexWrap:'wrap'}}>
              <StoreBadge store={product.store} size="md"/>
              <NutriBadge grade={product.nutriscore} source={product.nutriscoreSource} size="md"/>
              {product.remainingDays!=null&&
                <span style={{background:'#FFF3E0',color:'#E65100',fontSize:10,fontWeight:700,borderRadius:5,padding:'2px 6px'}}>🔥 {product.remainingDays} dage</span>}
            </div>
            <div style={{marginTop:10,display:'flex',alignItems:'baseline',gap:8}}>
              <span style={{fontSize:26,fontWeight:700,color:storeComparisons.length&&product.price===minPrice?'#2E7D32':'var(--label)'}}>{product.price.toFixed(2)} kr</span>
              {storeComparisons.length>1&&product.price>minPrice&&
                <span style={{fontSize:13,color:'#E65100',fontWeight:500}}>spar {saving} kr hos billigst</span>}
              {storeComparisons.length>1&&product.price===minPrice&&
                <span style={{background:'#E8F5E9',color:'#2E7D32',fontSize:12,fontWeight:700,borderRadius:20,padding:'3px 10px'}}>Billigst</span>}
            </div>
          </div>
        </div>
      </div>

      {/* Price comparison */}
      {storeComparisons.length>1&&(
        <>
          <p style={{fontSize:11,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--label3)',padding:'14px 16px 6px'}}>Sammenlign priser</p>
          <div style={{background:'white',borderRadius:12,margin:'0 16px',padding:'4px 0',overflow:'hidden'}}>
            {storeComparisons.map((p,i)=>{
              const pct=maxPrice>0?(p.price/maxPrice)*100:100;
              const isCheapest=p.price===minPrice;
              return(
                <div key={p.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderBottom:i<storeComparisons.length-1?'.5px solid #F2F2F7':'none'}}>
                  <div style={{width:90,flexShrink:0}}>
                    <StoreBadge store={p.store} size="sm"/>
                  </div>
                  <div style={{flex:1}}>
                    <div className="price-bar-track">
                      <div className="price-bar-fill" style={{width:`${pct}%`,background:isCheapest?'#2E7D32':pct>80?'#EF4444':'#F59E0B'}}/>
                    </div>
                  </div>
                  <div style={{width:60,textAlign:'right',flexShrink:0}}>
                    <span style={{fontSize:14,fontWeight:700,color:isCheapest?'#2E7D32':'var(--label)'}}>{p.price.toFixed(2)}</span>
                    <span style={{fontSize:11,color:'var(--label3)'}}> kr</span>
                  </div>
                  {isCheapest&&<span style={{fontSize:9,fontWeight:700,color:'#2E7D32',flexShrink:0}}>✓</span>}
                </div>
              );
            })}
          </div>
        </>
      )}

      {/* Nutrition */}
      {product.nutriscore&&(
        <>
          <p style={{fontSize:11,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--label3)',padding:'14px 16px 6px'}}>Nutri-Score</p>
          <div style={{background:'white',borderRadius:12,margin:'0 16px',padding:'12px 14px'}}>
            <NutriScale grade={product.nutriscore}/>
            {product.energyKcal!=null&&product.nutriscoreSource==='official'&&(
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:4,marginTop:12,textAlign:'center'}}>
                {[
                  ['Energi',product.energyKcal,'kcal'],
                  ['Fedt',product.fat,'g'],
                  ['Sukker',product.sugars,'g'],
                  ['Salt',product.salt,'g'],
                ].map(([label,val,unit])=>(
                  <div key={label}>
                    <p style={{margin:0,fontSize:10,color:'var(--label3)'}}>{label}</p>
                    <p style={{margin:'2px 0 0',fontSize:13,fontWeight:600}}>{val!=null?Number(val).toFixed(1):'–'}<span style={{fontSize:9,color:'var(--label3)',fontWeight:400}}> {unit}</span></p>
                  </div>
                ))}
              </div>
            )}
            {product.nutriscoreSource&&product.nutriscoreSource!=='official'?(
              <div style={{marginTop:10,padding:'8px 10px',background:'#FFF8E1',borderRadius:8,border:'.5px solid #FFE082'}}>
                <p style={{margin:0,fontSize:11,color:'#8D6E00',lineHeight:1.45}}>
                  <strong>~ Estimeret score.</strong>{' '}
                  {product.nutriscoreSource==='estimated'
                    ? 'Beregnet ud fra lignende produkter med kendt Nutri-Score.'
                    : 'Baseret på typisk score i denne '+(product.nutriscoreSource==='subcategory'?'underkategori':'kategori')+'.'}
                  {product.nutriscoreConf!=null&&` Sikkerhed ${Math.round(product.nutriscoreConf*100)}%.`}
                </p>
              </div>
            ):(
              <p style={{margin:'10px 0 0',fontSize:10,color:'var(--label3)',textAlign:'center'}}>Pr. 100 g/ml · kilde: Open Food Facts</p>
            )}
          </div>
        </>
      )}

      {/* Ingredients */}
      {product.ingredients&&(
        <>
          <p style={{fontSize:11,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--label3)',padding:'14px 16px 6px'}}>Ingredienser</p>
          <div style={{background:'white',borderRadius:12,margin:'0 16px',padding:'12px 14px'}}>
            <p style={{margin:0,fontSize:13,lineHeight:1.55,color:'var(--label2)'}}>{product.ingredients}</p>
            {product.allergens&&(
              <p style={{margin:'10px 0 0',fontSize:12,color:'#B00020',fontWeight:500}}>⚠️ Allergener: {product.allergens}</p>
            )}
          </div>
        </>
      )}

      {/* Category */}
      <p style={{fontSize:11,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--label3)',padding:'14px 16px 6px'}}>Detaljer</p>
      <div style={{background:'white',borderRadius:12,margin:'0 16px',padding:'10px 14px'}}>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:14,padding:'4px 0'}}>
          <span style={{color:'var(--label3)'}}>Kategori</span>
          <span style={{fontWeight:500}}>{product.category}</span>
        </div>
        {product.subcategory&&product.subcategory!==product.category&&(
          <div style={{display:'flex',justifyContent:'space-between',fontSize:14,padding:'4px 0',borderTop:'.5px solid #F2F2F7'}}>
            <span style={{color:'var(--label3)'}}>Underkategori</span>
            <span style={{fontWeight:500}}>{product.subcategory}</span>
          </div>
        )}
        <div style={{display:'flex',justifyContent:'space-between',fontSize:14,padding:'4px 0',borderTop:'.5px solid #F2F2F7'}}>
          <span style={{color:'var(--label3)'}}>Butik</span>
          <span style={{fontWeight:500}}>{sm(product.store).name}</span>
        </div>
        {storeComparisons.length>1&&(
          <div style={{display:'flex',justifyContent:'space-between',fontSize:14,padding:'4px 0',borderTop:'.5px solid #F2F2F7'}}>
            <span style={{color:'var(--label3)'}}>Tilgængelig i</span>
            <span style={{fontWeight:500}}>{storeComparisons.length} butikker</span>
          </div>
        )}
      </div>

      {/* Add to basket button */}
      <div style={{position:'fixed',bottom:0,left:0,right:0,background:'rgba(255,255,255,.95)',backdropFilter:'blur(20px)',padding:'12px 16px',paddingBottom:`calc(12px + env(safe-area-inset-bottom,0px))`,borderTop:'.5px solid rgba(0,0,0,.1)'}}>
        <button type="button" onClick={()=>{onAdd(product.id);}}
          style={{width:'100%',padding:15,borderRadius:14,background:inBasket?'#34C759':'#3478F6',color:'white',border:'none',fontSize:16,fontWeight:600,transition:'background .2s'}}>
          {inBasket?`✓ I kurven (${qty})`:'Tilføj til kurv'}
        </button>
      </div>
    </div>
  );
}

  const [term,setTerm]=useState(initialQuery||'');
  const [cat,setCat]=useState(initialCategory||'all');
  const [sub,setSub]=useState('all');
  const [subs,setSubs]=useState([]);
  const [selStores,setSel]=useState([]);
  const [sort,setSort]=useState('asc');
  const [cats,setCats]=useState([]);
  const [allStores,setAll]=useState([]);
  const inputRef=useRef(null);

  useEffect(()=>{
    if(!dbReady)return;
    getCats().then(c=>setCats(['all',...c]));
    getStores().then(setAll);
    search(initialQuery||'',{category:initialCategory||'all',subcategory:'all',stores:[],sortOrder:'asc'});
    setTimeout(()=>inputRef.current?.focus(),100);
  },[dbReady]);

  useEffect(()=>{
    if(!dbReady)return;
    setSub('all');
    getSubs(cat).then(setSubs);

// ── ERROR BOUNDARY ──
// Without this, any render error unmounts the whole tree and leaves a blank
// white page — which is exactly what a missing prop caused.
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={error:null};}
  static getDerivedStateFromError(error){return{error};}
  componentDidCatch(error,info){console.error('Beelee render error:',error,info);}
  render(){
    if(!this.state.error)return this.props.children;
    return(
      <div style={{minHeight:'100vh',background:'#1C1C1E',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
        <div style={{maxWidth:420,textAlign:'center'}}>

          <p style={{color:'rgba(255,255,255,.5)',fontSize:14,margin:'0 0 16px',lineHeight:1.5}}>
            Appen stødte på en fejl. Prøv at genindlæse — hjælper det ikke, så ryd data.
          </p>
          <pre style={{background:'rgba(255,255,255,.06)',color:'#FF8A80',fontSize:11,padding:12,borderRadius:8,textAlign:'left',overflow:'auto',maxHeight:140,margin:'0 0 16px'}}>
            {String(this.state.error?.message||this.state.error)}
          </pre>
          <div style={{display:'flex',gap:8,justifyContent:'center'}}>
            <button type="button" onClick={()=>location.reload()}
              style={{padding:'11px 20px',borderRadius:12,background:'#3478F6',color:'white',border:'none',fontSize:15,fontWeight:600}}>
              Genindlæs
            </button>
            <button type="button" onClick={async()=>{
                try{
                  indexedDB.deleteDatabase('BeeleeProductsDB');

              Ryd data
            </button>
          </div>
        </div>
      </div>
    );
  }
}

// ── RECEIPT SCANNER ──
// Tesseract is ~4 MB of wasm, so it only loads when the scanner opens.
let _tessPromise = null;
function loadTesseract(){
  if(_tessPromise) return _tessPromise;
  _tessPromise = new Promise((res,rej)=>{
    if(window.Tesseract) return res(window.Tesseract);
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=()=>res(window.Tesseract);
    s.onerror=()=>rej(new Error('Kunne ikke hente tekstgenkendelse'));
    document.head.appendChild(s);
  });
  return _tessPromise;
}

// Thermal receipts OCR far better with contrast pushed hard.
function preprocess(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      // Upscale small photos, cap large ones — Tesseract likes ~1600px wide
      const target=1600;
      const scale=Math.min(3,Math.max(1,target/img.width));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*scale);
      cv.height=Math.round(img.height*scale);
      const ctx=cv.getContext('2d');
      ctx.drawImage(img,0,0,cv.width,cv.height);
      const d=ctx.getImageData(0,0,cv.width,cv.height);
      const px=d.data;
      // Greyscale + contrast stretch
      for(let i=0;i<px.length;i+=4){
        let v=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];
        v=v<110?0:v>165?255:(v-110)*(255/55);
        px[i]=px[i+1]=px[i+2]=v;
      }
      ctx.putImageData(d,0,0);
      cv.toBlob(b=>b?res(b):rej(new Error('Billedet kunne ikke behandles')),'image/png');
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Ugyldigt billede'));};
    img.src=url;
  });
}

async function hashFile(file){
  try{
    const buf=await file.arrayBuffer();
    const h=await crypto.subtle.digest('SHA-256',buf);
    return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch{ return null; }
}

function ReceiptScanner({onClose,activeStore,getByIds,dbReady}){
  const [stage,setStage]     = useState('idle');   // idle|ocr|review|sending|done|error
  const [progress,setProg]   = useState(0);
  const [error,setError]     = useState('');
  const [rows,setRows]       = useState([]);
  const [parsed,setParsed]   = useState(null);
  const [imageHash,setHash]  = useState(null);
  const [result,setResult]   = useState(null);
  const fileRef = useRef(null);

  async function handleFile(e){
    const file=e.target.files?.[0];
    if(!file) return;
    setStage('ocr'); setProg(0); setError('');
    try{
      const [Tess,clean,hash]=await Promise.all([
        loadTesseract(), preprocess(file), hashFile(file),
      ]);
      setHash(hash);
      const {data}=await Tess.recognize(clean,'dan+eng',{
        logger:m=>{ if(m.status==='recognizing text') setProg(Math.round(m.progress*100)); },
      });

      const p=window.BeeleeReceipt.parseReceipt(data.text||'');
      setParsed(p);
      if(!p.items.length){
        setError('Ingen varelinjer fundet. Prøv et skarpere billede i godt lys.');
        setStage('error'); return;
      }

      // Match against the catalogue already in IndexedDB
      const store = activeStore?.chain || p.store;
      const cat = await window.ProductDB.search({searchTerm:'',stores:store?[store]:null,limit:4000});
      const matcher = new window.BeeleeReceipt.ReceiptMatcher(
        cat.map(x=>({title:x.title,store:x.store,price:x.price,id:x.id,productKey:x.productKey}))
      );
      setRows(matcher.matchReceipt(p,store).map((r,i)=>({...r,key:i,include:r.status==='matched'})));
      setStage('review');
    }catch(err){
      setError(err.message||'Noget gik galt'); setStage('error');
    }
  }

  const toggle = k => setRows(rs=>rs.map(r=>r.key===k?{...r,include:!r.include}:r));
  const included = rows.filter(r=>r.include && r.match);

  async function submit(){
    setStage('sending');
    try{
      const token=localStorage.getItem('beelee_token');
      const res=await fetch(`${API_URL}/api/receipts`,{
        method:'POST',
        headers:{'Content-Type':'application/json',
                 ...(token?{Authorization:`Bearer ${token}`}:{})},
        body:JSON.stringify({
          chain: activeStore?.chain || parsed.store,
          store_id: activeStore?.id || null,
          purchased_at: parsed.date,
          printed_total: parsed.printed_total,
          image_hash: imageHash,
          lines: included.map(r=>({
            product_key: r.match.productKey,
            price: r.receipt.unit_price,
            match_score: r.score,
          })),
        }),
      });
      const data=await res.json();
      if(!res.ok) throw new Error(data.error||'Kunne ikke sende');
      setResult(data); setStage('done');
    }catch(err){
      setError(err.message); setStage('error');
    }
  }

  const H = ({children}) => (
    <p style={{margin:0,fontSize:11,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--label3)',padding:'14px 16px 6px'}}>{children}</p>
  );

  return(
    <div className="slide-panel" style={{overflowY:'auto',paddingBottom:100}}>
      <div style={{background:'rgba(242,242,247,.92)',backdropFilter:'blur(20px)',padding:'50px 16px 12px',position:'sticky',top:0,zIndex:10,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <button type="button" onClick={onClose} style={{color:'var(--blue)',fontSize:16,background:'none',border:'none'}}>Luk</button>
        <span style={{fontSize:16,fontWeight:600}}>Scan kvittering</span>
        <span style={{width:36}}/>
      </div>

      {stage==='idle'&&(
        <div style={{padding:'20px 16px'}}>
          <div style={{background:'white',borderRadius:14,padding:'28px 20px',textAlign:'center'}}>
            <div style={{width:56,height:56,borderRadius:'50%',background:'#EAF1FE',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px'}}>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3478F6" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
            </div>
            <p style={{margin:0,fontSize:17,fontWeight:600}}>Tag et billede af bonnen</p>
            <p style={{margin:'6px 0 0',fontSize:13,color:'var(--label3)',lineHeight:1.5}}>
              Billedet bliver på telefonen. Kun varelinjer og priser sendes videre.
            </p>
            <button type="button" onClick={()=>fileRef.current?.click()}
              style={{marginTop:18,width:'100%',padding:14,borderRadius:12,background:'#3478F6',color:'white',border:'none',fontSize:16,fontWeight:600}}>
              Vælg billede
            </button>
            <input ref={fileRef} type="file" accept="image/*" capture="environment"
              onChange={handleFile} style={{display:'none'}}/>
          </div>
          {activeStore&&(
            <p style={{margin:'12px 4px 0',fontSize:12,color:'var(--label3)',textAlign:'center'}}>
              Registreres som {activeStore.name}
            </p>
          )}
        </div>
      )}

      {stage==='ocr'&&(
        <div style={{padding:'60px 24px',textAlign:'center'}}>
          <span className="spin" style={{width:28,height:28}}/>
          <p style={{margin:'16px 0 4px',fontSize:16,fontWeight:500}}>Læser bonnen…</p>
          <p style={{margin:0,fontSize:13,color:'var(--label3)'}}>{progress}%</p>
          <div style={{margin:'14px auto 0',maxWidth:220,height:4,background:'#E4E4E7',borderRadius:2,overflow:'hidden'}}>
            <div style={{width:`${progress}%`,height:'100%',background:'#3478F6',transition:'width .3s'}}/>
          </div>
        </div>
      )}

      {stage==='review'&&(
        <>
          <div style={{background:'white',margin:'12px 16px 0',borderRadius:12,padding:'12px 14px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div>
                <p style={{margin:0,fontSize:15,fontWeight:600}}>{activeStore?.name||parsed?.store||'Ukendt butik'}</p>
                <p style={{margin:'2px 0 0',fontSize:12,color:'var(--label3)'}}>
                  {parsed?.date||'Ukendt dato'} · {rows.length} linjer
                </p>
              </div>
              <span style={{fontSize:13,fontWeight:600,color:'#2E7D32'}}>{included.length} valgt</span>
            </div>
            {parsed?.warnings?.map((w,i)=>(
              <p key={i} style={{margin:'8px 0 0',fontSize:11,color:'#8D6E00',background:'#FFF8E1',borderRadius:7,padding:'6px 9px'}}>{w}</p>
            ))}
          </div>

          <H>Tjek linjerne</H>
          <div style={{background:'white',borderRadius:12,margin:'0 16px',overflow:'hidden'}}>
            {rows.map(r=>(
              <div key={r.key} onClick={()=>r.match&&toggle(r.key)}
                style={{display:'flex',alignItems:'center',gap:10,padding:'10px 13px',borderBottom:'.5px solid #F2F2F7',opacity:r.match?1:.55}}>
                <span style={{width:20,height:20,borderRadius:'50%',flexShrink:0,border:r.include?'none':'1.5px solid #C7C7CC',background:r.include?'#34C759':'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  {r.include&&<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.5" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>}
                </span>
                <span style={{flex:1,minWidth:0}}>
                  <span style={{display:'block',fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                    {r.match?r.match.title:r.receipt.name}
                  </span>
                  <span style={{display:'block',fontSize:11,color:'var(--label3)',marginTop:2}}>
                    {r.receipt.name}
                    {r.status==='ambiguous'&&<span style={{color:'#E65100'}}> · usikker</span>}
                    {r.status==='unmatched'&&<span style={{color:'#C62828'}}> · ingen match</span>}
                  </span>
                </span>
                <span style={{fontSize:14,fontWeight:600,flexShrink:0}}>{r.receipt.unit_price.toFixed(2)}</span>
              </div>
            ))}
          </div>

          <div style={{padding:'16px'}}>
            <button type="button" onClick={submit} disabled={!included.length}
              style={{width:'100%',padding:14,borderRadius:12,background:included.length?'#3478F6':'#C7C7CC',color:'white',border:'none',fontSize:16,fontWeight:600}}>
              Send {included.length} priser
            </button>
            <p style={{margin:'10px 4px 0',fontSize:11,color:'var(--label3)',textAlign:'center',lineHeight:1.5}}>
              Kun produkt og pris sendes. Billedet forlader aldrig telefonen.
            </p>
          </div>
        </>
      )}

      {stage==='sending'&&(
        <div style={{padding:'60px 24px',textAlign:'center'}}>
          <span className="spin" style={{width:28,height:28}}/>
          <p style={{margin:'16px 0 0',fontSize:16}}>Sender…</p>
        </div>
      )}

      {stage==='done'&&(
        <div style={{padding:'50px 24px',textAlign:'center'}}>
          <div style={{width:60,height:60,borderRadius:'50%',background:'#E8F5E9',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px'}}>
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" strokeWidth="2.5" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <p style={{margin:0,fontSize:19,fontWeight:600}}>
            {result?.duplicate?'Allerede registreret':'Tak!'}
          </p>
          <p style={{margin:'6px 0 0',fontSize:14,color:'var(--label3)'}}>
            {result?.duplicate
              ? 'Den bon er allerede i systemet.'
              : `${result?.accepted||0} priser tilføjet.`}
          </p>
          <button type="button" onClick={onClose}
            style={{marginTop:22,padding:'13px 28px',borderRadius:12,background:'#3478F6',color:'white',border:'none',fontSize:15,fontWeight:600}}>
            Færdig
          </button>
        </div>
      )}

      {stage==='error'&&(
        <div style={{padding:'40px 24px',textAlign:'center'}}>
          <p style={{margin:0,fontSize:17,fontWeight:600}}>Det gik ikke</p>
          <p style={{margin:'8px 0 0',fontSize:14,color:'var(--label3)',lineHeight:1.5}}>{error}</p>
          <button type="button" onClick={()=>{setStage('idle');setError('');}}
            style={{marginTop:20,padding:'13px 28px',borderRadius:12,background:'#3478F6',color:'white',border:'none',fontSize:15,fontWeight:600}}>
            Prøv igen
          </button>
        </div>
      )}
    </div>
  );
}

// ── APP ──
function App(){
  const [tab,setTab]=useState('home'); // home | search | basket
  const [detailProduct,setDetailProduct]=useState(null);
  const [scanning,setScanning]=useState(false);
  const [searchQuery,setSearchQuery]=useState('');
  const [searchCategory,setSearchCategory]=useState('all');
  const [user,setUser]=useState(()=>{
    try{const t=localStorage.getItem('beelee_token'),u=localStorage.getItem('beelee_user');return t&&u?JSON.parse(u):null;}catch{return null;}
  });

  const{dbReady,total,loading,updated,products,search,getCats,getSubs,getStores,getByIds,getOffers,refresh}=useProducts();
  const{basket,add,remove,setQty,clear,inBasket,getQty}=useBasket();
  const{coords,status:geoStatus,nearestByChain,locate,
        candidates,activeStore,shouldAsk,confirmStore,dismissStorePrompt,leaveStore}=useStores();

  if(!user)return<LoginScreen onLogin={setUser}/>;

  const logout=()=>{['beelee_token','beelee_user'].forEach(k=>localStorage.removeItem(k));setUser(null);};

  const goSearch=(query='',category='all')=>{
    setSearchQuery(query);
    setSearchCategory(category);
    setTab('search');
  };

  const basketCount=basket.reduce((s,i)=>s+i.qty,0);

  return(
    <div style={{background:'var(--bg)',minHeight:'100vh'}}>
      {/* Large title area */}
      <div style={{background:'rgba(242,242,247,.9)',backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',borderBottom:'.5px solid rgba(0,0,0,.08)',padding:'50px 20px 10px',position:'sticky',top:0,zIndex:50}}>
        <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',maxWidth:640,margin:'0 auto'}}>
          <div>
            <p style={{margin:0,fontSize:11,color:'var(--label3)',fontWeight:600,letterSpacing:'.04em',textTransform:'uppercase'}}>
              {tab==='home'?'Oversigt':tab==='search'?'Søg':'Din kurv'}
            </p>
            <h1 style={{margin:'2px 0 0',fontSize:28,fontWeight:700,color:'var(--label)',letterSpacing:'-.4px',lineHeight:1.1}}>
              {tab==='home'?'🐝 Beelee':tab==='search'?'Søg':detailProduct?detailProduct.title.split(' ').slice(0,3).join(' '):'Kurv'}
            </h1>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            {tab!=='search'&&!loading&&updated&&(
              <button type="button" onClick={refresh} style={{width:32,height:32,borderRadius:'50%',background:'rgba(118,118,128,.12)',border:'none',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--label3)',fontSize:16}}>↻</button>
            )}
            <button type="button" onClick={logout} style={{fontSize:13,color:'var(--blue)',fontWeight:500,background:'none',border:'none',padding:'4px 0'}}>{user.name||user.id}</button>
          </div>
        </div>
      </div>

      {/* Content */}
      <div style={{maxWidth:640,margin:'0 auto'}}>
        {tab==='home'&&(
          <HomeView
            dbReady={dbReady} total={total} loading={loading} updated={updated}
            getOffers={getOffers} getCats={getCats} search={search}
            geoStatus={geoStatus} locate={locate} nearestByChain={nearestByChain}
            activeStore={activeStore} leaveStore={leaveStore} onScan={()=>setScanning(true)}
            onProductTap={p=>{setDetailProduct(p);}}
            inBasket={inBasket} onAdd={add} getQty={getQty}
            onSearch={goSearch}
          />
        )}
        {tab==='search'&&(
          <SearchView
            dbReady={dbReady} total={total} loading={loading} products={products}
            search={search} getCats={getCats} getSubs={getSubs} getStores={getStores}
            nearestByChain={nearestByChain}
            onProductTap={p=>{setDetailProduct(p);}}
            inBasket={inBasket} onAdd={add} getQty={getQty}
            initialQuery={searchQuery} initialCategory={searchCategory}
          />
        )}
        {tab==='basket'&&(
          <BasketView
            nearestByChain={nearestByChain}
            basket={basket} getByIds={getByIds}
            setQty={setQty} remove={remove} clear={clear} inBasket={inBasket}
          />
        )}
      </div>

      {/* Product detail panel */}
      {detailProduct&&(
        <ProductDetail
          product={detailProduct}
          onClose={()=>setDetailProduct(null)}
          onAdd={add} inBasket={inBasket(detailProduct.id)} qty={getQty(detailProduct.id)}
          getByIds={getByIds}
        />
      )}

      {/* Receipt scanner */}
      {scanning&&(
        <ReceiptScanner
          onClose={()=>setScanning(false)}
          activeStore={activeStore}
          getByIds={getByIds}
          dbReady={dbReady}
        />
      )}

      {/* Store confirmation */}
      {shouldAsk&&(
        <StoreConfirmModal
          candidates={candidates}
          onConfirm={confirmStore}
          onDismiss={dismissStorePrompt}
        />
      )}

      {/* Tab bar */}
      <nav className="tabbar">
        <div style={{display:'flex',maxWidth:640,margin:'0 auto',width:'100%'}}>
          <button type="button" className={`tab${tab==='home'?' active':''}`} onClick={()=>{setDetailProduct(null);setTab('home');}}>
            <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Start
          </button>
          <button type="button" className={`tab${tab==='search'?' active':''}`} onClick={()=>{setDetailProduct(null);setTab('search');}}>
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            Søg
          </button>
          <button type="button" className={`tab${tab==='basket'?' active':''}`} onClick={()=>{setDetailProduct(null);setTab('basket');}} style={{position:'relative'}}>
            <svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
            {basketCount>0&&<span style={{position:'absolute',top:6,right:'calc(50% - 18px)',background:'#FF3B30',color:'white',fontSize:9,fontWeight:700,borderRadius:10,padding:'1px 5px',minWidth:16,textAlign:'center'}}>{basketCount>99?'99+':basketCount}</span>}
            Kurv
          </button>
        </div>
      </nav>
    </div>
  );
}

window.addEventListener('error',e=>console.error('Beelee uncaught:',e.error||e.message));
window.addEventListener('unhandledrejection',e=>console.error('Beelee unhandled rejection:',e.reason));

ReactDOM.render(
  <ErrorBoundary><App/></ErrorBoundary>,
  document.getElementById('root')
);
</script>
</body>
</html>
