<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4F46E5">
  <meta name="description" content="Compare products across 5 stores with smart pricing, recipes, and shopping basket">
  
  <!-- Apple iOS specific meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Beelee">
  
  <!-- Apple touch icons -->
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">
  
  <!-- PWA manifest -->
  <link rel="manifest" href="./manifest.json">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./icon-192.png">
  
  <title>Beelee</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- XLSX library -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    #root {
      width: 100%;
      min-height: 100vh;
    }
    
    /* iOS Safari specific fixes */
    @supports (-webkit-touch-callout: none) {
      body {
        min-height: -webkit-fill-available;
      }
    }
    
    /* Install prompt styles */
    .install-prompt {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 9999;
      animation: slideUp 0.3s ease-out;
    }
    
    @keyframes slideUp {
      from {
        transform: translateY(100px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    .install-prompt-buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    
    .install-prompt button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .install-prompt .install-btn {
      background: white;
      color: #667eea;
    }
    
    .install-prompt .dismiss-btn {
      background: rgba(255,255,255,0.2);
      color: white;
    }
  </style>
</head>
<body>
  <div id="root">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
      <div style="background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
        <div style="width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
        <h2 style="color: #333; margin: 0 0 10px 0;">Loading Beelee...</h2>
        <p style="color: #666; margin: 0;">Please wait</p>
      </div>
    </div>
  </div>
  <div id="install-prompt"></div>
  
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  
  <!-- Load the React app -->
  <script type="text/babel">
    // Check if app is loading
    console.log('App is starting...');
    
    // Load the JSX file
    fetch('/product-price-sorter.jsx')
      .then(response => {
        if (!response.ok) {
          throw new Error('Failed to load app file');
        }
        return response.text();
      })
      .then(code => {
        // Execute the JSX code
        const script = document.createElement('script');
        script.type = 'text/babel';
        script.text = code;
        document.body.appendChild(script);
      })
      .catch(error => {
        console.error('Error loading app:', error);
        document.getElementById('root').innerHTML = `
          <div style="padding: 20px; text-align: center;">
            <h1 style="color: red;">⚠️ App Failed to Load</h1>
            <p>Error: ${error.message}</p>
            <p>Please check that all files are uploaded correctly.</p>
            <button onclick="location.reload()" style="padding: 10px 20px; font-size: 16px; margin-top: 20px;">
              🔄 Retry
            </button>
          </div>
        `;
      });
  </script>
  
  <!-- PWA Registration Script -->
  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then((registration) => {
            console.log('ServiceWorker registered:', registration.scope);
          })
          .catch((error) => {
            console.log('ServiceWorker registration failed:', error);
          });
      });
    }
    
    // Install prompt for iOS and other browsers
    let deferredPrompt;
    const installPromptContainer = document.getElementById('install-prompt');
    
    // Show install prompt
    function showInstallPrompt() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      
      // Don't show if already installed
      if (isStandalone) {
        return;
      }
      
      // Check if user dismissed the prompt before
      if (localStorage.getItem('installPromptDismissed') === 'true') {
        return;
      }
      
      const promptHTML = isIOS ? `
        <div class="install-prompt">
          <strong>📱 Install Beelee on your iPhone</strong>
          <p style="margin: 8px 0; font-size: 14px;">
            Tap <strong>Share</strong> <svg style="display: inline; width: 16px; height: 16px;" fill="currentColor" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> then <strong>"Add to Home Screen"</strong>
          </p>
          <div class="install-prompt-buttons">
            <button class="dismiss-btn" onclick="dismissInstallPrompt()">Dismiss</button>
          </div>
        </div>
      ` : `
        <div class="install-prompt">
          <strong>📱 Install Beelee</strong>
          <p style="margin: 8px 0; font-size: 14px;">
            Add to your home screen for quick access!
          </p>
          <div class="install-prompt-buttons">
            <button class="install-btn" onclick="installApp()">Install</button>
            <button class="dismiss-btn" onclick="dismissInstallPrompt()">Not now</button>
          </div>
        </div>
      `;
      
      // Show prompt after 3 seconds
      setTimeout(() => {
        installPromptContainer.innerHTML = promptHTML;
      }, 3000);
    }
    
    // Install app (for Android/Chrome)
    window.installApp = async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response: ${outcome}`);
        deferredPrompt = null;
      }
      dismissInstallPrompt();
    };
    
    // Dismiss install prompt
    window.dismissInstallPrompt = () => {
      installPromptContainer.innerHTML = '';
      localStorage.setItem('installPromptDismissed', 'true');
    };
    
    // Listen for install prompt event
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      showInstallPrompt();
    });
    
    // Show install prompt on page load
    window.addEventListener('load', () => {
      setTimeout(showInstallPrompt, 2000);
    });
    
    // Track if app was installed
    window.addEventListener('appinstalled', () => {
      console.log('PWA was installed');
      dismissInstallPrompt();
    });
  </script>
</body>
</html>
