  <script type="text/babel">
    const { useState, useMemo, useCallback, useEffect, useRef } = React;
    
    // Custom Virtual Scrolling Hook (no external library needed!)
    function useVirtualScroll(items, itemHeight = 100, containerHeight = 600) {
      const [scrollTop, setScrollTop] = useState(0);
      const containerRef = useRef(null);

      const handleScroll = useCallback((e) => {
        setScrollTop(e.target.scrollTop);
      }, []);

      // Calculate which items to render
      const startIndex = Math.floor(scrollTop / itemHeight);
      const endIndex = Math.min(
        items.length - 1,
        Math.floor((scrollTop + containerHeight) / itemHeight)
      );

      // Add buffer for smooth scrolling
      const bufferSize = 5;
      const visibleStartIndex = Math.max(0, startIndex - bufferSize);
      const visibleEndIndex = Math.min(items.length - 1, endIndex + bufferSize);

      const visibleItems = items.slice(visibleStartIndex, visibleEndIndex + 1);
      const offsetY = visibleStartIndex * itemHeight;
      const totalHeight = items.length * itemHeight;

      return {
        visibleItems,
        offsetY,
        totalHeight,
        containerRef,
        handleScroll,
        visibleStartIndex
      };
    }
    
    const hasVirtualScrolling = true; // Always enabled now!
    console.log('✅ Custom virtual scrolling enabled!');
    
    // ==================== API & DATA CONFIGURATION ====================
    const API_URL = 'https://beelee-backend-production.up.railway.app';
    const GITHUB_USERNAME = 'Jedawg';
    const DATA_URL = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/beelee/main/data/products.xlsx`;
    
    // Lucide React icons (inline SVG components)
    const Upload = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>;
    const ArrowUpDown = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>;
    const Search = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;

    const ChefHat = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><line x1="6" x2="18" y1="17" y2="17"/></svg>;
    const Plus = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
    const Trash2 = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;
    const ShoppingCart = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>;
    const Save = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
    const BookOpen = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
    const ShoppingBag = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>;
    const TrendingDown = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>;
    const Share2 = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>;
    const Mail = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>;
    const MessageCircle = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>;
    const MessageSquare = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;

    // ==================== STORAGE ====================
    const recipeStorage = {
      async list() {
        if (!window.storage) return [];
        try {
          const result = await window.storage.list('recipe:');
          if (!result || !result.keys) return [];
          const recipes = [];
          for (const key of result.keys) {
            const data = await window.storage.get(key);
            if (data) recipes.push(JSON.parse(data.value));
          }
          return recipes;
        } catch {
          return [];
        }
      },
      async save(recipe) {
        if (!window.storage) return;
        await window.storage.set(`recipe:${recipe.id}`, JSON.stringify(recipe));
      },
      async remove(id) {
        if (!window.storage) return;
        await window.storage.delete(`recipe:${id}`);
      }
    };

    // ==================== UTILS ====================
    const fileCache = new Map();

    async function parseExcel(file) {
      if (fileCache.has(file.name)) return fileCache.get(file.name);
      const buffer = await file.arrayBuffer();
      const wb = XLSX.read(buffer);
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws);
      const products = rows.map(row => ({
        id: crypto.randomUUID(),
        title: row.title || 'Unknown',
        price: Number(row.price) || 0,
        category: row.category || 'Uncategorized',
        store: row.store || 'Unknown',
        imageBase64: row.image_base64 || null,
        offerExpiryDate: row.offer_expiry_date || null,
        remainingDays: row.remaining_days !== undefined ? Number(row.remaining_days) : null
      }));
      fileCache.set(file.name, products);
      return products;
    }

    function calculateDaysRemaining(expiryDate) {
      if (!expiryDate) return null;
      const expiry = new Date(expiryDate);
      const now = new Date();
      const diffTime = expiry - now;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return diffDays > 0 ? diffDays : 0;
    }

    function getStoreColor(store) {
      const colors = {
        'Rema1000': { bg: 'bg-blue-100', text: 'text-blue-700', name: 'REMA 1000' },
        'Netto': { bg: 'bg-yellow-100', text: 'text-yellow-700', name: 'NETTO' },
        'Min Kobmand': { bg: 'bg-green-800', text: 'text-white', name: 'MIN KØBMAND' },
        'Spar': { bg: 'bg-green-600', text: 'text-white', name: 'SPAR' },
        'Føtex': { bg: 'bg-blue-600', text: 'text-white', name: 'FØTEX' },
        'SuperBrugsen & Kvickly': { bg: 'bg-red-600', text: 'text-white', name: 'SUPERBRUGSEN & KVICKLY' },
        '365': { bg: 'bg-green-200', text: 'text-green-900', name: '365' },
        'Meny': { bg: 'bg-red-700', text: 'text-white', name: 'MENY' },
        'Brugsen': { bg: 'bg-red-600', text: 'text-white', name: 'BRUGSEN' },
        'Lidl': { bg: 'bg-yellow-400', text: 'text-blue-900', name: 'LIDL' }
      };
      return colors[store] || { bg: 'bg-gray-100', text: 'text-gray-700', name: store.toUpperCase() };
    }

    function getCheapestByCategory(productsById) {
      const byCategory = {};
      Object.values(productsById).forEach(product => {
        const cat = product.category;
        if (!byCategory[cat] || product.price < byCategory[cat].price) {
          byCategory[cat] = product;
        }
      });
      return Object.values(byCategory).sort((a, b) => a.category.localeCompare(b.category));
    }

    // ==================== SHARE FUNCTION ====================
    function generateBasketText(basket, productsById) {
      const storeGroups = {};
      let totalPrice = 0;

      basket.forEach(item => {
        const product = productsById[item.productId];
        if (!product) return;
        
        if (!storeGroups[product.store]) {
          storeGroups[product.store] = { items: [], total: 0 };
        }
        
        const itemTotal = product.price * item.quantity;
        storeGroups[product.store].items.push({
          title: product.title,
          quantity: item.quantity,
          price: product.price,
          total: itemTotal
        });
        storeGroups[product.store].total += itemTotal;
        totalPrice += itemTotal;
      });

      let text = '🛒 SHOPPING BASKET\n';
      text += '═══════════════════════════════\n\n';

      Object.entries(storeGroups).forEach(([store, data]) => {
        const storeInfo = getStoreColor(store);
        text += `📍 ${storeInfo.name}\n`;
        text += `───────────────────────────────\n`;
        
        data.items.forEach(item => {
          text += `• ${item.title}\n`;
          text += `  ${item.quantity}x ${item.price.toFixed(2)} kr = ${item.total.toFixed(2)} kr\n`;
        });
        
        text += `\nStore Total: ${data.total.toFixed(2)} kr\n\n`;
      });

      text += '═══════════════════════════════\n';
      text += `GRAND TOTAL: ${totalPrice.toFixed(2)} kr\n`;
      text += `Total Items: ${basket.reduce((sum, item) => sum + item.quantity, 0)}\n`;
      text += `Stores: ${Object.keys(storeGroups).length}\n`;
      text += '═══════════════════════════════\n';
      text += `Generated: ${new Date().toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })}\n`;

      return text;
    }

    // ==================== HOOKS ====================
    function useProducts() {
      const [productsById, setProductsById] = useState({});
      const [productIds, setProductIds] = useState([]);
      const [autoLoading, setAutoLoading] = useState(true);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [autoLoadError, setAutoLoadError] = useState(false);

      // ⚠️ Backend connection configured above
      const PRODUCT_DATA_URL = DATA_URL;

      useEffect(() => {
        autoLoadFromGitHub();
      }, []);

      const autoLoadFromGitHub = async () => {
        setAutoLoading(true);
        setAutoLoadError(false);
        try {
          const response = await fetch(PRODUCT_DATA_URL + '?t=' + Date.now()); // bust cache
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const buffer = await response.arrayBuffer();
          const wb = XLSX.read(buffer);
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws);

          const products = rows.map(row => ({
            id: crypto.randomUUID(),
            title: row.title || 'Unknown',
            price: Number(row.price) || 0,
            category: row.category || 'Uncategorized',
            store: row.store || 'Unknown',
            imageBase64: row.image_base64 || null,
            offerExpiryDate: row.offer_expiry_date || null,
            remainingDays: row.remaining_days !== undefined ? Number(row.remaining_days) : null
          }));

          const newById = {};
          const newIds = [];
          products.forEach(p => { newById[p.id] = p; newIds.push(p.id); });

          setProductsById(newById);
          setProductIds(newIds);
          setLastUpdated(new Date().toLocaleString('da-DK', { dateStyle: 'medium', timeStyle: 'short' }));
          console.log(`✅ Auto-loaded ${products.length} products from GitHub`);
        } catch (err) {
          console.log('Auto-load failed (manual upload still works):', err.message);
          setAutoLoadError(true);
        } finally {
          setAutoLoading(false);
        }
      };

      const addProductsFromFile = useCallback(async (file) => {
        const newProducts = await parseExcel(file);
        setProductsById(prev => {
          const next = { ...prev };
          newProducts.forEach(p => { if (!next[p.id]) next[p.id] = p; });
          return next;
        });
        setProductIds(prev => {
          const set = new Set(prev);
          newProducts.forEach(p => set.add(p.id));
          return Array.from(set);
        });
        setLastUpdated(new Date().toLocaleString('da-DK', { dateStyle: 'medium', timeStyle: 'short' }));
      }, []);

      return { productsById, productIds, addProductsFromFile, autoLoading, lastUpdated, autoLoadError, refreshFromGitHub: autoLoadFromGitHub };
    }

    function useRecipes(productsById) {
      const [recipes, setRecipes] = useState([]);
      const [currentRecipe, setCurrentRecipe] = useState({ id: null, name: '', ingredients: [] });
      const [loading, setLoading] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);

      // Load recipes from backend on mount AND when user changes
      useEffect(() => {
        const userStr = localStorage.getItem('beelee_user');
        if (userStr) {
          const user = JSON.parse(userStr);
          const userId = user.id || user.username;
          
          // If user changed, clear recipes and reload
          if (currentUser !== userId) {
            setCurrentUser(userId);
            setRecipes([]); // Clear old recipes immediately
            setCurrentRecipe({ id: null, name: '', ingredients: [] });
            loadRecipesFromBackend();
          }
        }
      }, [currentUser]);

      // Also load on mount
      useEffect(() => { 
        loadRecipesFromBackend();
      }, []);

      const getAuthToken = () => {
        return localStorage.getItem('beelee_token');
      };

      const loadRecipesFromBackend = async () => {
        const token = getAuthToken();
        if (!token) return;

        try {
          const response = await fetch(`${API_URL}/api/recipes`, {
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });
          
          if (response.ok) {
            const data = await response.json();
            setRecipes(data);
          }
        } catch (err) {
          console.log('Failed to load recipes from backend:', err);
          // Fallback to local storage if backend fails
          try {
            const stored = localStorage.getItem('beelee_recipes_backup');
            if (stored) setRecipes(JSON.parse(stored));
          } catch {}
        }
      };

      const saveRecipe = useCallback(async () => {
        if (!currentRecipe.name.trim() || currentRecipe.ingredients.length === 0) {
          alert('Please enter a recipe name and add ingredients');
          return;
        }
        
        setLoading(true);
        const token = getAuthToken();
        
        const recipe = {
          id: currentRecipe.id || crypto.randomUUID(),
          name: currentRecipe.name,
          ingredients: currentRecipe.ingredients,
          createdAt: currentRecipe.id ? recipes.find(r => r.id === currentRecipe.id)?.createdAt || new Date().toISOString() : new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };

        try {
          // Save to backend
          const response = await fetch(`${API_URL}/api/recipes`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(recipe)
          });

          if (!response.ok) throw new Error('Backend save failed');

          // Update local state
          if (currentRecipe.id) {
            setRecipes(prev => prev.map(r => r.id === recipe.id ? recipe : r));
            alert('✅ Recipe updated on server!');
          } else {
            setRecipes(prev => [...prev, recipe]);
            alert('✅ Recipe saved to server!');
          }
          
          // Backup to local storage
          localStorage.setItem('beelee_recipes_backup', JSON.stringify([...recipes, recipe]));
          
          setCurrentRecipe({ id: recipe.id, name: recipe.name, ingredients: recipe.ingredients });
        } catch (err) {
          alert('⚠️ Could not save to server. Saved locally instead.');
          // Fallback to local storage
          const updated = currentRecipe.id 
            ? recipes.map(r => r.id === recipe.id ? recipe : r)
            : [...recipes, recipe];
          setRecipes(updated);
          localStorage.setItem('beelee_recipes_backup', JSON.stringify(updated));
          setCurrentRecipe({ id: recipe.id, name: recipe.name, ingredients: recipe.ingredients });
        } finally {
          setLoading(false);
        }
      }, [currentRecipe, recipes]);

      const deleteRecipe = useCallback(async (id) => {
        const token = getAuthToken();
        
        try {
          // Delete from backend
          await fetch(`${API_URL}/api/recipes/${id}`, {
            method: 'DELETE',
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });
        } catch (err) {
          console.log('Backend delete failed, deleting locally');
        }

        // Update local state
        setRecipes(prev => prev.filter(r => r.id !== id));
        if (currentRecipe.id === id) {
          setCurrentRecipe({ id: null, name: '', ingredients: [] });
        }
        
        // Update backup
        const updated = recipes.filter(r => r.id !== id);
        localStorage.setItem('beelee_recipes_backup', JSON.stringify(updated));
      }, [currentRecipe.id, recipes]);

      const loadRecipe = useCallback((recipe) => {
        setCurrentRecipe({ id: recipe.id, name: recipe.name, ingredients: recipe.ingredients });
      }, []);

      const updateRecipeName = useCallback((name) => {
        setCurrentRecipe(prev => ({ ...prev, name }));
      }, []);

      const addIngredient = useCallback((productId, quantity, searchTerm) => {
        setCurrentRecipe(prev => {
          const existing = prev.ingredients.find(i => i.productId === productId);
          if (existing) {
            return { ...prev, ingredients: prev.ingredients.map(i => i.productId === productId ? { ...i, quantity: i.quantity + quantity } : i) };
          }
          return { ...prev, ingredients: [...prev.ingredients, { productId, quantity, searchTerm }] };
        });
      }, []);

      const removeIngredient = useCallback((productId) => {
        setCurrentRecipe(prev => ({ ...prev, ingredients: prev.ingredients.filter(i => i.productId !== productId) }));
      }, []);

      const updateIngredientQuantity = useCallback((productId, quantity) => {
        if (quantity <= 0) {
          removeIngredient(productId);
        } else {
          setCurrentRecipe(prev => ({ ...prev, ingredients: prev.ingredients.map(i => i.productId === productId ? { ...i, quantity } : i) }));
        }
      }, []);

      const createNewRecipe = useCallback(() => {
        setCurrentRecipe({ id: null, name: '', ingredients: [] });
      }, []);

      return { recipes, currentRecipe, saveRecipe, loadRecipe, deleteRecipe, updateRecipeName, addIngredient, removeIngredient, updateIngredientQuantity, createNewRecipe, loading };
    }

    function useBasket() {
      const [basket, setBasket] = useState([]);
      const [syncing, setSyncing] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);

      // Load basket from backend on mount AND when user changes
      useEffect(() => {
        const userStr = localStorage.getItem('beelee_user');
        if (userStr) {
          const user = JSON.parse(userStr);
          const userId = user.id || user.username;
          
          // If user changed, clear basket and reload
          if (currentUser !== userId) {
            setCurrentUser(userId);
            setBasket([]); // Clear old basket immediately
            loadBasketFromBackend();
          }
        }
      }, [currentUser]);

      // Also load on mount
      useEffect(() => {
        loadBasketFromBackend();
      }, []);

      const getAuthToken = () => {
        return localStorage.getItem('beelee_token');
      };

      const loadBasketFromBackend = async () => {
        const token = getAuthToken();
        if (!token) return;

        try {
          const response = await fetch(`${API_URL}/api/basket`, {
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });
          
          if (response.ok) {
            const data = await response.json();
            setBasket(data);
          }
        } catch (err) {
          console.log('Failed to load basket from backend:', err);
          // Fallback to local storage
          try {
            const stored = localStorage.getItem('beelee_basket_backup');
            if (stored) setBasket(JSON.parse(stored));
          } catch {}
        }
      };

      const syncBasketToBackend = async (updatedBasket) => {
        const token = getAuthToken();
        if (!token) return;

        setSyncing(true);
        try {
          await fetch(`${API_URL}/api/basket`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ basket: updatedBasket })
          });
          
          // Also backup locally
          localStorage.setItem('beelee_basket_backup', JSON.stringify(updatedBasket));
        } catch (err) {
          console.log('Failed to sync basket:', err);
          // Save to local storage as backup
          localStorage.setItem('beelee_basket_backup', JSON.stringify(updatedBasket));
        } finally {
          setSyncing(false);
        }
      };

      const addToBasket = useCallback((productId, quantity = 1) => {
        setBasket(prev => {
          const existing = prev.find(item => item.productId === productId);
          const updated = existing
            ? prev.map(item => item.productId === productId ? { ...item, quantity: item.quantity + quantity } : item)
            : [...prev, { productId, quantity }];
          
          syncBasketToBackend(updated);
          return updated;
        });
      }, []);

      const removeFromBasket = useCallback((productId) => {
        setBasket(prev => {
          const updated = prev.filter(item => item.productId !== productId);
          syncBasketToBackend(updated);
          return updated;
        });
      }, []);

      const updateBasketQuantity = useCallback((productId, quantity) => {
        if (quantity <= 0) {
          removeFromBasket(productId);
        } else {
          setBasket(prev => {
            const updated = prev.map(item => item.productId === productId ? { ...item, quantity } : item);
            syncBasketToBackend(updated);
            return updated;
          });
        }
      }, []);

      const clearBasket = useCallback(async () => {
        const token = getAuthToken();
        
        try {
          await fetch(`${API_URL}/api/basket`, {
            method: 'DELETE',
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });
        } catch (err) {
          console.log('Backend clear failed');
        }
        
        setBasket([]);
        localStorage.removeItem('beelee_basket_backup');
      }, []);

      const addRecipeToBasket = useCallback((ingredients) => {
        setBasket(prev => {
          const updated = [...prev];
          ingredients.forEach(ing => {
            const existingIndex = updated.findIndex(item => item.productId === ing.productId);
            if (existingIndex >= 0) {
              updated[existingIndex] = { ...updated[existingIndex], quantity: updated[existingIndex].quantity + ing.quantity };
            } else {
              updated.push({ productId: ing.productId, quantity: ing.quantity });
            }
          });
          syncBasketToBackend(updated);
          return updated;
        });
      }, []);

      return { basket, addToBasket, removeFromBasket, updateBasketQuantity, clearBasket, addRecipeToBasket, syncing };
    }

          storeGroups[product.store].total += product.price * item.quantity;

    // ==================== AUTH (BACKEND) ====================
    // No passwords in HTML! Everything on Railway server 🔐
    
    function LoginScreen({ onLogin }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [rememberMe, setRememberMe] = useState(true); // Default to checked
      const [error, setError] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [loginAttempted, setLoginAttempted] = useState(false);

      // Check if there's a remembered user on mount
      useEffect(() => {
        const rememberedUser = localStorage.getItem('beelee_remembered_username');
        if (rememberedUser) {
          setUsername(rememberedUser);
        }
      }, []);

      const handleLogin = async () => {
        // Prevent double submission
        if (isLoading || loginAttempted) {
          console.log('Login already in progress, skipping...');
          return;
        }
        
        if (!username.trim() || !password.trim()) {
          setError('Please enter both username and password');
          return;
        }
        
        setIsLoading(true);
        setLoginAttempted(true);
        setError('');

        try {
          // Call backend API to login
          const response = await fetch(`${API_URL}/api/login`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              username: username.trim(),
              password: password.trim()
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Login failed');
          }

          // Save token and user info
          localStorage.setItem('beelee_token', data.token);
          localStorage.setItem('beelee_user', JSON.stringify(data.user));
          
          // Remember Me functionality
          if (rememberMe) {
            localStorage.setItem('beelee_remembered_username', username.trim());
            localStorage.setItem('beelee_remember_me', 'true');
          } else {
            localStorage.removeItem('beelee_remembered_username');
            localStorage.removeItem('beelee_remember_me');
          }
          
          // Small delay before calling onLogin to ensure state is saved
          setTimeout(() => {
            onLogin(data.user);
          }, 100);
          
        } catch (err) {
          setError('❌ ' + (err.message || 'Connection failed. Check your internet.'));
          setIsLoading(false);
          setLoginAttempted(false);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !isLoading && !loginAttempted) {
          e.preventDefault();
          handleLogin();
        }
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-blue-700 flex items-center justify-center p-4">
          <div className="w-full max-w-sm">
            {/* Logo */}
            <div className="text-center mb-8">
              <div className="text-6xl mb-3">🐝</div>
              <h1 className="text-4xl font-bold text-white">Beelee</h1>
              <p className="text-indigo-200 mt-2">Sign in to continue</p>
            </div>

            {/* Login Card */}
            <div className="bg-white rounded-2xl shadow-2xl p-8">
              <div className="space-y-5">

                {/* Username */}
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                  <input
                    type="text"
                    value={username}
                    onChange={(e) => { setUsername(e.target.value); setError(''); }}
                    onKeyDown={handleKeyDown}
                    placeholder="Enter your username"
                    className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 text-gray-800 text-base"
                    autoCapitalize="none"
                    autoCorrect="off"
                  />
                </div>

                {/* Password */}
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                  <div className="relative">
                    <input
                      type={showPassword ? 'text' : 'password'}
                      value={password}
                      onChange={(e) => { setPassword(e.target.value); setError(''); }}
                      onKeyDown={handleKeyDown}
                      placeholder="Enter your password"
                      className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 text-gray-800 text-base pr-12"
                    />
                    <button
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-sm font-semibold"
                    >
                      {showPassword ? 'Hide' : 'Show'}
                    </button>
                  </div>
                </div>

                {/* Error Message */}
                {error && (
                  <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm font-medium">
                    {error}
                  </div>
                )}

                {/* Remember Me */}
                <div className="flex items-center">
                  <input
                    type="checkbox"
                    id="rememberMe"
                    checked={rememberMe}
                    onChange={(e) => setRememberMe(e.target.checked)}
                    className="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500"
                  />
                  <label htmlFor="rememberMe" className="ml-2 text-sm text-gray-700 cursor-pointer">
                    Remember me on this device
                  </label>
                </div>

                {/* Login Button */}
                <button
                  onClick={handleLogin}
                  disabled={isLoading}
                  className="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold text-lg hover:bg-indigo-700 active:bg-indigo-800 disabled:opacity-60 transition-colors"
                >
                  {isLoading ? '⏳ Signing in...' : '🐝 Sign In'}
                </button>
              </div>
            </div>

            <p className="text-center text-indigo-200 text-sm mt-6">
              Beelee · Smart Grocery Shopping
            </p>
          </div>
        </div>
      );
    }

    // ==================== MAIN APP ====================
    function App() {
      const [activeTab, setActiveTab] = useState('products');
      const [loggedInUser, setLoggedInUser] = useState(() => {
        // Check if user has a valid token
        const token = localStorage.getItem('beelee_token');
        const userStr = localStorage.getItem('beelee_user');
        if (token && userStr) {
          try {
            return JSON.parse(userStr);
          } catch {
            return null;
          }
        }
        return null;
      });
      
      const { productsById, productIds, addProductsFromFile, autoLoading, lastUpdated, autoLoadError, refreshFromGitHub } = useProducts();
      const { recipes, currentRecipe, saveRecipe, loadRecipe, deleteRecipe, updateRecipeName, addIngredient, removeIngredient, updateIngredientQuantity, createNewRecipe, loading: recipesLoading } = useRecipes(productsById);
      const { basket, addToBasket, removeFromBasket, updateBasketQuantity, clearBasket, addRecipeToBasket, syncing: basketSyncing } = useBasket();

      // Verify token is still valid on mount
      useEffect(() => {
        let verificationAttempted = false;
        
        const verifyToken = async () => {
          // Prevent multiple verification attempts
          if (verificationAttempted) return;
          verificationAttempted = true;
          
          const token = localStorage.getItem('beelee_token');
          if (!token) return;

          try {
            const response = await fetch(`${API_URL}/api/verify`, {
              headers: {
                'Authorization': `Bearer ${token}`
              },
              timeout: 5000 // 5 second timeout
            });

            if (!response.ok) {
              // Token invalid, clear and force re-login
              console.log('Token invalid, clearing session');
              localStorage.removeItem('beelee_token');
              localStorage.removeItem('beelee_user');
              setLoggedInUser(null);
            } else {
              console.log('Token verified successfully');
            }
          } catch (err) {
            // Network error or timeout - DON'T clear login!
            console.log('Token verification failed (network error), keeping cached login');
            // User can still use the app offline
          }
        };

        if (loggedInUser) {
          verifyToken();
        }
      }, []); // Empty dependency array - only run once on mount!

      const handleLogout = () => {
        const rememberMe = localStorage.getItem('beelee_remember_me') === 'true';
        
        // Clear session data
        localStorage.removeItem('beelee_token');
        localStorage.removeItem('beelee_user');
        localStorage.removeItem('beelee_basket_backup');
        localStorage.removeItem('beelee_recipes_backup');
        
        // Keep username if remember me is enabled
        // (Username will auto-fill on next login)
        if (!rememberMe) {
          localStorage.removeItem('beelee_remembered_username');
        }
        
        // Clear state
        setLoggedInUser(null);
        
        // Force page reload to clear all React state
        window.location.reload();
      };

      // Show login screen if not authenticated
      if (!loggedInUser) {
        return <LoginScreen onLogin={setLoggedInUser} />;
      }

      // Force complete remount when user changes (clears ALL React state)
      const userKey = loggedInUser.id || loggedInUser.username || 'user';

      return (
        <div key={userKey} className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-3 md:p-6">
          <div className="max-w-6xl mx-auto">

                </div>
                <div className="text-right">
                  <p className="text-xs text-gray-500 mb-1">👋 {loggedInUser.name || loggedInUser.id}</p>
                  <button
                    onClick={handleLogout}
                    className="text-xs px-3 py-1.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-red-50 hover:text-red-600 font-semibold transition-colors"
                  >
                    Sign Out
                  </button>
                </div>
              </div>

              {/* Auto-load status banner */}
              {autoLoading && (
                <div className="mb-4 p-3 bg-indigo-50 border border-indigo-200 rounded-lg flex items-center gap-3">
                  <div className="w-4 h-4 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin flex-shrink-0"></div>
                  <p className="text-sm text-indigo-700 font-medium">Loading latest prices from Beelee...</p>
                </div>
              )}

              {!autoLoading && lastUpdated && (
                <div className="mb-4 p-3 bg-green-50 border border-green-200 rounded-lg flex items-center justify-between">

                    <span className="text-green-600">✅</span>

                  <div>
                    <p className="text-sm text-orange-700 font-medium">⚠️ Could not auto-load prices</p>
                    <p className="text-xs text-orange-600">Upload an Excel file manually below, or check your GitHub setup</p>
                  </div>
                  <button
                    onClick={refreshFromGitHub}
                    className="text-xs px-3 py-1.5 bg-orange-600 text-white rounded-lg hover:bg-orange-700 font-semibold ml-2"
                  >
                    Retry
                  </button>
                </div>
              )}

              <div className="flex gap-2 mt-4 mb-6 border-b border-gray-200 overflow-x-auto">
                <button onClick={() => setActiveTab('products')} className={`flex items-center gap-2 px-4 py-3 font-semibold whitespace-nowrap ${activeTab === 'products' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-gray-500'}`}>
                  <ShoppingCart className="w-5 h-5" />
                  <span className="hidden sm:inline">Products</span>
                </button>
                <button onClick={() => setActiveTab('offers')} className={`flex items-center gap-2 px-4 py-3 font-semibold whitespace-nowrap ${activeTab === 'offers' ? 'text-green-600 border-b-2 border-green-600' : 'text-gray-500'}`}>
                  <TrendingDown className="w-5 h-5" />
                  <span className="hidden sm:inline">Best Offers</span>
                </button>
                <button onClick={() => setActiveTab('recipes')} className={`flex items-center gap-2 px-4 py-3 font-semibold whitespace-nowrap ${activeTab === 'recipes' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-gray-500'}`}>
                  <ChefHat className="w-5 h-5" />
                  <span className="hidden sm:inline">Recipes</span>
                </button>
                <button onClick={() => setActiveTab('basket')} className={`flex items-center gap-2 px-4 py-3 font-semibold whitespace-nowrap ${activeTab === 'basket' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-gray-500'}`}>
                  <ShoppingBag className="w-5 h-5" />
                  <span className="hidden sm:inline">Basket</span>
                  {basket.length > 0 && <span className="bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">{basket.length}</span>}
                </button>
              </div>

              {activeTab === 'products' && <ProductsTab productsById={productsById} productIds={productIds} onUpload={addProductsFromFile} onAddToBasket={addToBasket} />}
              {activeTab === 'offers' && <BestOffersTab productsById={productsById} onAddToBasket={addToBasket} />}
              {activeTab === 'recipes' && <RecipesTab productsById={productsById} productIds={productIds} recipes={recipes} currentRecipe={currentRecipe} onSave={saveRecipe} onLoad={loadRecipe} onDelete={deleteRecipe} onUpdateName={updateRecipeName} onAddIngredient={addIngredient} onRemoveIngredient={removeIngredient} onUpdateQuantity={updateIngredientQuantity} onCreateNew={createNewRecipe} onAddToBasket={addRecipeToBasket} />}
              {activeTab === 'basket' && <BasketTab basket={basket} productsById={productsById} onUpdateQuantity={updateBasketQuantity} onRemove={removeFromBasket} onClear={clearBasket} />}
            </div>
          </div>
        </div>
      );
    }

    // Render the app
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then((registration) => {
            console.log('✅ Beelee is ready to work offline!');
          })
          .catch((error) => {
            console.log('ServiceWorker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
